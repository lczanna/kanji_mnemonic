<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>N3 Kanji Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one thumb-reach column, fixed bottom tabs; study runs as a full-screen sheet.
   Kanji are set in Mincho because that is the typeface the JLPT paper prints them in. */
:root {
  --paper: #eef1f6;
  --surface: #fbfcfe;
  --ink: #18202f;
  --muted: #5a6477;
  --line: #d3d9e4;
  --ai: #2b4a8b;          /* aizome indigo, the accent */
  --ai-soft: #dde5f3;
  --again: #c4471b;
  --hard: #a86f12;
  --good: #23784f;
  --easy: #2a68aa;
  --grid: #e3a49a;        /* genkō yōshi practice-grid red */
  --font-kanji: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
    --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
    --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
  --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
  --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- bottom tabs ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs button { background: none; border: 0; padding: 10px 4px 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button .jp { font-family: var(--font-kanji); font-size: 20px; line-height: 1.1; font-weight: 800; }
.tabs button[aria-current="page"] { color: var(--ai); }

/* ---------- today ---------- */
.today-head { display: grid; gap: 4px; margin-bottom: 18px; }
.countdown { display: flex; align-items: baseline; gap: 10px; }
.countdown .big { font-family: var(--font-kanji); font-weight: 800; font-size: 56px; line-height: 1; color: var(--ai); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: grid; gap: 14px; }
.levels { display: grid; gap: 12px; }
.level-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.level-row .lv { font-weight: 700; }
.bar { height: 10px; border-radius: 6px; background: var(--ai-soft); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .s-known { background: var(--ai); }
.bar .s-learning { background: color-mix(in srgb, var(--ai) 45%, var(--ai-soft)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.cta { display: grid; gap: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 14px 16px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--surface); }
.btn.primary .muted { color: color-mix(in srgb, var(--surface) 75%, var(--ai)); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn .count { font-family: var(--font-kanji); font-weight: 800; font-size: 26px; line-height: 1; }
.btn .label { display: grid; gap: 2px; }
.btn .label b { font-size: 16px; }
.btn .label small { font-size: 12px; }
.small-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.small-btn.danger { color: var(--again); border-color: color-mix(in srgb, var(--again) 50%, var(--line)); }
.plan-line { font-size: 13px; color: var(--muted); }
.plan-card { gap: 8px; }
.plan-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plan-top b { font-size: 16px; }
.pace { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: 13px; align-items: baseline; }
.pace .ok { color: var(--good); } .pace .behind { color: var(--again); }

/* ---------- study sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }
.sheet-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 18px; }
.progress { height: 6px; background: var(--ai-soft); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ai); transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.card-front { display: grid; justify-items: center; gap: 10px; padding-block: 10px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); }
.tag.new { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.tag.relearn { background: color-mix(in srgb, var(--again) 15%, var(--surface)); color: var(--again); }

/* genkō yōshi cell: the square with dashed centre guides used on kanji practice sheets */
.cell {
  width: min(62vw, 230px); aspect-ratio: 1; max-width: 100%; position: relative;
  border: 2px solid var(--grid); display: grid; place-items: center;
  background:
    linear-gradient(var(--grid), var(--grid)) center / 100% 1px no-repeat,
    linear-gradient(var(--grid), var(--grid)) center / 1px 100% no-repeat;
}
.cell::before { content: ""; position: absolute; inset: 0; background: var(--surface); opacity: .55; }
.cell .k { position: relative; font-family: var(--font-kanji); font-weight: 800; font-size: min(46vw, 170px); line-height: 1; }
.word-front { font-family: var(--font-kanji); font-weight: 800; font-size: clamp(44px, 15vw, 72px); line-height: 1.15; padding: 18px 22px; border: 2px solid var(--grid); text-align: center; display: grid; gap: 4px; max-width: 100%; }
.word-front span { font-family: var(--font-body); font-weight: 500; font-size: 20px; color: var(--ai); }
.word-front.revealed { font-size: 40px; padding: 8px 16px; }
.prompt { font-size: 13px; color: var(--muted); text-align: center; }

.back { display: grid; gap: 14px; }
.headline { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.headline .k-small { font-family: var(--font-kanji); font-weight: 800; font-size: 64px; line-height: 1; }
.keyword { font-size: 22px; font-weight: 700; line-height: 1.2; }
.meaning { font-size: 13px; color: var(--muted); }
.card-img.small { aspect-ratio: 16 / 7; }
.card-img { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; display: block; background: var(--ai-soft); }
.story { font-size: 16px; line-height: 1.65; }
.story .kw { color: var(--ai); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.story .prim { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; border-bottom: 2px solid color-mix(in srgb, var(--ai) 35%, transparent); }
.story .prim:hover, .story .prim:focus-visible { background: var(--ai-soft); }
button.chip { background: none; font: inherit; font-size: 12px; cursor: pointer; }
.part-of { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.part-of .chip { color: var(--ink); }
.story .snd { font-weight: 700; color: var(--hard); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.section-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.sound { display: grid; gap: 6px; }
.sound-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--hard) 10%, var(--surface)); }
.sound-row .r { font-weight: 700; font-size: 16px; min-width: 3.2em; }
.readings { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.readings dt { font-weight: 700; color: var(--muted); font-size: 12px; padding-top: 2px; }
.readings dd { margin: 0; min-width: 0; }
.vocab { display: grid; gap: 0; }
.vocab-row { display: grid; grid-template-columns: minmax(0, auto) 1fr; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.vocab-row:first-child { border-top: 0; }
.vocab-row .w { font-family: var(--font-kanji); font-weight: 800; font-size: 20px; line-height: 1.2; }
.vocab-row .rd { font-size: 14px; color: var(--ai); font-weight: 500; align-self: end; }
.vocab-row .m { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.answer-bar .row { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); }
.answer-bar .row.one { grid-template-columns: 1fr; }
.answer-bar .row.two { grid-template-columns: 1fr 1fr; }
.ans { border: 0; border-radius: 12px; padding: 12px 4px; font-weight: 700; display: grid; gap: 1px; justify-items: center; color: var(--surface); }
.ans small { font-weight: 400; font-size: 11px; opacity: .85; }
.ans.again { background: var(--again); } .ans.hard { background: var(--hard); }
.ans.good { background: var(--good); } .ans.easy { background: var(--easy); }
.ans.reveal, .ans.next { background: var(--ai); }
.ans.skip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

/* ---------- deck ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--surface); }
.search { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font: inherit; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 2px 5px; display: grid; justify-items: center; gap: 0; position: relative; }
.tile .k { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.15; }
.tile .kwd { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 3px; }
.tile::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.tile.st-learning::after { background: var(--hard); }
.tile.st-struggling::after { background: var(--again); }
.tile.st-good::after { background: var(--good); }
.tile.st-mastered::after { background: var(--ai); }

/* ---------- stats ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi .v { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.1; }
.kpi .l { font-size: 12px; color: var(--muted); }
.forecast { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 110px; }
.forecast .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; min-width: 0; }
.forecast .b { width: 100%; background: var(--ai); border-radius: 3px 3px 0 0; min-height: 2px; }
.forecast .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.forecast .d { font-size: 10px; color: var(--muted); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; }
.heat i { width: 12px; height: 12px; border-radius: 2px; background: var(--ai-soft); }
.heat i.l1 { background: color-mix(in srgb, var(--ai) 30%, var(--ai-soft)); }
.heat i.l2 { background: color-mix(in srgb, var(--ai) 55%, var(--ai-soft)); }
.heat i.l3 { background: color-mix(in srgb, var(--ai) 80%, var(--ai-soft)); }
.heat i.l4 { background: var(--ai); }
.leech-list { display: flex; flex-wrap: wrap; gap: 6px; }
.leech { border: 1px solid color-mix(in srgb, var(--again) 40%, var(--line)); background: var(--surface); border-radius: 10px; padding: 4px 10px; font-family: var(--font-kanji); font-weight: 800; font-size: 22px; }

/* ---------- more ---------- */
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="number"], input[type="date"] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cast div { font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.cast b { display: inline-block; min-width: 3em; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--ai-soft); }
.confirm { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--again); }

.modal { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; align-items: end; }
.modal-body { background: var(--paper); max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 560px; margin: 0 auto; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
/* ---------- words & grammar ---------- */
.say { border: 1px solid var(--line); background: var(--surface); color: var(--ai); border-radius: 999px; width: 28px; height: 28px; font-size: 11px; display: inline-grid; place-items: center; vertical-align: middle; padding: 0; }
.word-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.word-head .w { font-family: var(--font-kanji); font-weight: 800; font-size: 44px; line-height: 1.1; }
.word-head .w.kana { font-family: var(--font-body); font-weight: 700; font-size: 36px; }
.kform { font-family: var(--font-kanji); font-weight: 800; color: var(--ink); font-size: 16px; }
.word-head .rd { font-size: 20px; color: var(--ai); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.parts { display: grid; gap: 6px; }
.part { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.part .k { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; color: var(--ink); line-height: 1.1; }
.g-head .pattern { font-family: var(--font-kanji); font-weight: 800; font-size: 30px; line-height: 1.2; }
.g-note { margin: 0; font-size: 14px; color: var(--muted); }
.examples { display: grid; gap: 10px; }
.ex .ja { font-size: 17px; line-height: 1.6; }
.ex .en { font-size: 13px; color: var(--muted); }
.ex .sense { font-size: 12px; color: var(--hard); margin-top: 2px; }
.word-front.kana { font-family: var(--font-body); font-weight: 700; white-space: nowrap; max-width: 100%; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-size: 20px; font-family: var(--font-kanji); font-weight: 800; text-align: left; min-width: 0; }
.opt .num { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--again); background: color-mix(in srgb, var(--again) 14%, var(--surface)); }
.opt.dim { opacity: .5; }
.opt[disabled] { cursor: default; }
.chunks .opt { font-size: 17px; justify-content: center; }
.chunks .opt.with-gl { display: grid; justify-items: center; gap: 2px; }
.cgl { font-family: var(--font-body); font-weight: 400; font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; }
.cgl b { color: var(--ai); font-weight: 500; }
.parts-gl { width: 100%; display: grid; gap: 6px; }
.parts-gl div { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; border-left: 3px solid var(--line); padding-left: 8px; }
.parts-gl b { font-size: 16px; }
.parts-gl .cgl { text-align: left; font-size: 13px; }
.opts.g .opt, .chunks .opt { font-family: var(--font-body); font-weight: 700; font-size: 17px; }
.opts.g.long { grid-template-columns: 1fr; }
.g-q { font-size: 19px; line-height: 1.9; width: 100%; }
.g-q .blank { display: inline-block; padding: 0 6px; border-bottom: 2px solid var(--ai); color: var(--ai); font-weight: 700; }
.g-q.order { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.slot { position: relative; min-width: 64px; border: 1px dashed var(--ai); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.slot.filled { border-style: solid; }
.slot.right { border: 1px solid var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.slot.wrong { border: 1px solid var(--again); background: color-mix(in srgb, var(--again) 14%, var(--surface)); }
.slot .star { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--hard); }
.why { font-size: 14px; color: var(--muted); width: 100%; display: flex; gap: 8px; align-items: center; }
.tr { width: 100%; font-size: 14px; color: var(--ink); }
.err-note { position: fixed; left: 12px; right: 12px; bottom: 96px; z-index: 50; background: var(--again); color: #fff; font-size: 13px; padding: 10px 12px; border-radius: 10px; }
.wrongs { width: 100%; display: grid; gap: 6px; font-size: 13px; color: var(--muted); line-height: 1.45; }
.wrongs div { border-left: 3px solid var(--line); padding-left: 8px; }
.wrongs div.picked { border-left-color: var(--again); color: var(--ink); }
.wrongs b { font-family: var(--font-body); color: var(--ink); margin-right: 4px; }
.tr .small-btn { font-size: 12px; padding: 5px 10px; }
.list { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; align-items: baseline; text-align: left; border: 1px solid var(--line); border-left-width: 4px; background: var(--surface); border-radius: 10px; padding: 8px 12px; }
.lrow .w { font-family: var(--font-kanji); font-weight: 800; font-size: 20px; }
.lrow .rd { color: var(--ai); font-size: 14px; }

<body>
<main class="wrap" id="app"><div class="loading">Loading deck…</div></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="today" aria-current="page"><span class="jp">今日</span>Today</button>
  <button data-view="deck"><span class="jp">一覧</span>Deck</button>
  <button data-view="stats"><span class="jp">記録</span>Stats</button>
  <button data-view="more"><span class="jp">設定</span>More</button>
</nav>

<div class="sheet" id="sheet" hidden></div>
<div class="answer-bar" id="answer-bar" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-body" id="modal-body"></div></div>
<div class="gl-pop" id="gl-pop" hidden role="status"></div>

<script>
'use strict';
// ============ DATA ============
// Three decks share one scheduler. Progress keys: kanji character, "v:<word>", "g:<grammar id>".
let DECK = [], BY_KANJI = {};      // kanji (kanji.json)
let VOCAB = [], BY_WORD = {};      // words (vocab.json)
let GRAMMAR = [], BY_GID = {};     // grammar (grammar.json)
let GL = {};                       // sentence → tappable words [start, length, reading, lemma, lemmaReading, meaning]
let CAST = {}, CAST_NOTE = '';
let EXAMPLES = {};                 // word → [[japanese, english, glosses], ...] (examples.json, loaded after start)
let PARTS = {};                    // story part name → {g: glyph, of: [part names]} (tools/build_parts.py)
const TYPES = ['kanji', 'vocab', 'grammar'];
const TYPE_LABEL = { kanji: 'Kanji', vocab: 'Words', grammar: 'Grammar' };
const TYPE_JP = { kanji: '漢字', vocab: '語彙', grammar: '文法' };
function deckOf(type) { return type === 'kanji' ? DECK : type === 'vocab' ? VOCAB : GRAMMAR; }
function keyOf(type, x) { return type === 'kanji' ? x.kanji : type === 'vocab' ? 'v:' + x.w : 'g:' + x.id; }

// ============ DATES (local time, not UTC) ============
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function addDays(dateStr, n) { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

// ============ FSRS-4.5 ============
const FSRS = {
  w: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755],
  DECAY: -0.5, FACTOR: 19 / 81,
  clampD(d) { return Math.min(10, Math.max(1, d)); },
  initS(g) { return this.w[g - 1]; },
  initD(g) { return this.clampD(this.w[4] - (g - 3) * this.w[5]); },
  R(t, s) { return Math.pow(1 + this.FACTOR * t / s, this.DECAY); },
  interval(s, retention) { return Math.max(1, Math.round(s / this.FACTOR * (Math.pow(retention, 1 / this.DECAY) - 1))); },
  nextD(d, g) { return this.clampD(this.w[7] * this.initD(3) + (1 - this.w[7]) * (d - this.w[6] * (g - 3))); },
  nextS(d, s, r, g) {
    const w = this.w;
    if (g === 1) return Math.min(s, w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r)));
    const hard = g === 2 ? w[15] : 1, easy = g === 4 ? w[16] : 1;
    return s * (Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp(w[10] * (1 - r)) - 1) * hard * easy + 1);
  }
};

// ============ STORAGE ============
// Same key as the previous app, so existing progress (keyed by kanji character) carries over.
const STORAGE_KEY = 'kanji_srs_data';
function emptyData() {
  return { version: 3, cards: {}, triaged: {}, newByDay: {}, history: {},
           stats: { totalReviews: 0, correctReviews: 0, streak: 0, lastReviewDate: null },
           settings: { examDate: '2026-12-06', newPerDay: 'auto', vocabPerDay: 'auto', grammarPerDay: 'auto', bufferDays: 14, retention: 0.9,
                       minWeekday: 30, minWeekend: 60 } };
}
function loadData() {
  let d = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
  const base = emptyData();
  if (!d || typeof d !== 'object') return base;
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  d.settings = Object.assign(base.settings, d.settings || {});
  d.stats = Object.assign(base.stats, d.stats || {});
  // The old default of 25 words a day becomes the time-based plan, unless it was set by hand.
  if (!d.settingsAt && d.settings.vocabPerDay === '25') d.settings.vocabPerDay = 'auto';
  d.version = 3;
  return d;
}
let storageOk = true;
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function saveData() { saveLocal(); scheduleSync(); }

// ============ CLOUD SYNC (Claude link only) ============
// On the claude.ai link, progress is also saved to the viewer's private database, so it survives
// cleared browser data and follows them across devices. Elsewhere this stays off and the app is local-only.
// Cards are packed and split across 4 documents to stay well under the 256 KB document limit.
const SYNC = { db: null, uid: null, state: 'local', at: null, pushed: {}, timer: null, busy: false, again: false };
const SHARDS = 4;
function shardOf(key) { let h = 0; for (const ch of key) h = (h * 31 + ch.codePointAt(0)) | 0; return Math.abs(h) % SHARDS; }
const r3 = x => Math.round((x || 0) * 1000) / 1000;
function packCard(c) { return [r3(c.stability), r3(c.difficulty), c.reps || 0, c.lapses || 0, c.lastReview || '', c.due || '', c.triaged ? 1 : 0]; }
function unpackCard(a) { const c = { stability: a[0], difficulty: a[1], reps: a[2], lapses: a[3], lastReview: a[4] || null, due: a[5] || null }; if (a[6]) c.triaged = true; return c; }
function syncBodies() {
  const shards = [...Array(SHARDS)].map(() => ({}));
  for (const [k, c] of Object.entries(appData.cards)) shards[shardOf(k)][k] = packCard(c);
  const d = appData;
  const bodies = { meta: { stats: d.stats, settings: d.settings, settingsAt: d.settingsAt || 0, history: d.history, newByDay: d.newByDay,
    triaged: d.triaged, lastBackup: d.lastBackup || null, hideHomeTip: !!d.hideHomeTip,
    planStart: d.planStart || null, timing: d.timing || null } };
  shards.forEach((cards, i) => { bodies['cards' + i] = { cards }; });
  return bodies;
}
function scheduleSync() {
  if (!SYNC.db) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => { SYNC.timer = null; flushSync(); }, 600);
}
// Leaving mid-session (closing the window, switching apps): send progress now rather than after the pause.
// Only answers still waiting to be sent go out: a page that hasn't changed anything (say an old tab left open)
// must never write its copy over newer progress. Each answer is already saved on the device as it happens.
function flushNow() { if (SYNC.db && SYNC.timer) { clearTimeout(SYNC.timer); SYNC.timer = null; flushSync(); } }
addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); });
async function flushSync() {
  if (!SYNC.db) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true;
  try {
    const bodies = syncBodies();
    for (const [name, body] of Object.entries(bodies)) {
      const str = JSON.stringify(body);
      if (SYNC.pushed[name] === str) continue;
      await SYNC.db.doc(`data/users/${SYNC.uid}/${name}`).set(body);   // one write at a time per document
      SYNC.pushed[name] = str;
    }
    SYNC.state = 'synced'; SYNC.at = new Date();
  } catch (e) {
    SYNC.state = e && e.code === 'quota_exceeded' ? 'full' : 'error';
  } finally {
    SYNC.busy = false;
    if (SYNC.again) { SYNC.again = false; scheduleSync(); }
    updateSyncBadge();
  }
}
function newerCard(a, b) {
  // A card's most recent review wins; on the same day, the one with more reviews.
  const la = a.lastReview || '', lb = b.lastReview || '';
  return la !== lb ? la > lb : (a.reps || 0) > (b.reps || 0);
}
function mergeRemote(remote) {
  const d = appData;
  for (const [k, c] of Object.entries(remote.cards)) if (!d.cards[k] || newerCard(c, d.cards[k])) d.cards[k] = c;
  const m = remote.meta;
  if (!m) return;
  for (const [day, n] of Object.entries(m.history || {})) d.history[day] = Math.max(d.history[day] || 0, n);
  for (const [day, n] of Object.entries(m.newByDay || {})) d.newByDay[day] = Math.max(d.newByDay[day] || 0, n);
  for (const [k, v] of Object.entries(m.triaged || {})) if (!d.triaged[k]) d.triaged[k] = v;
  const rs = m.stats || {};
  d.stats.totalReviews = Math.max(d.stats.totalReviews || 0, rs.totalReviews || 0);
  d.stats.correctReviews = Math.max(d.stats.correctReviews || 0, rs.correctReviews || 0);
  if ((rs.lastReviewDate || '') > (d.stats.lastReviewDate || '')) { d.stats.lastReviewDate = rs.lastReviewDate; d.stats.streak = rs.streak; }
  if ((m.settingsAt || 0) > (d.settingsAt || 0)) { d.settings = Object.assign(d.settings, m.settings || {}); d.settingsAt = m.settingsAt; }
  if ((m.lastBackup || '') > (d.lastBackup || '')) d.lastBackup = m.lastBackup;
  if (m.hideHomeTip) d.hideHomeTip = true;
  if (m.planStart && (!d.planStart || m.planStart.date < d.planStart.date)) d.planStart = m.planStart;
  if (m.timing && !d.timing) d.timing = m.timing;
}
async function pullRemote() {
  const names = ['meta', ...[...Array(SHARDS)].map((_, i) => 'cards' + i)];
  const snaps = await Promise.all(names.map(n => SYNC.db.doc(`data/users/${SYNC.uid}/${n}`).get()));
  const remote = { cards: {}, meta: null };
  snaps.forEach((snap, i) => {
    if (!snap.exists) return;
    // The database hands back read-only objects; work on a plain copy, or later updates fail
    // ("Attempted to assign to readonly property").
    const body = JSON.parse(JSON.stringify(snap.data()));
    if (names[i] === 'meta') remote.meta = body;
    else for (const [k, a] of Object.entries(body.cards || {})) remote.cards[k] = unpackCard(a);
  });
  mergeRemote(remote);
  planCache = null;
  saveLocal();
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    SYNC.db = db; SYNC.uid = uid; SYNC.state = 'syncing'; updateSyncBadge();
    await pullRemote();
    takeSnapshot();   // a device with no local progress still gets today's copy, from the cloud
    if (!session) render();
    await flushSync();
    document.addEventListener('visibilitychange', () => {
      // Coming back to the app (e.g. after studying on another device): pick up the other device's progress.
      if (document.visibilityState === 'visible' && SYNC.db && !session) pullRemote().then(() => { render(); scheduleSync(); }).catch(() => {});
    });
  } catch (e) {
    SYNC.db = null; SYNC.state = 'local'; updateSyncBadge();
  }
}
function syncText() {
  if (SYNC.state === 'synced') return `Saved to your Claude account${SYNC.at ? ' · ' + SYNC.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}`;
  if (SYNC.state === 'syncing') return 'Syncing with your Claude account…';
  if (SYNC.state === 'error') return 'Could not reach your Claude account. Progress is safe on this device and will sync on the next answer.';
  if (SYNC.state === 'full') return 'Your Claude storage for this app is full. Download a backup from More.';
  return 'Saved on this device only. Open the Claude link to sync across devices.';
}
function updateSyncBadge() { const el = document.getElementById('sync-line'); if (el) { el.textContent = syncText(); el.dataset.state = SYNC.state; } }
let appData = loadData();

// ============ SAFETY SNAPSHOTS ============
// Once a day, the first time the app opens, a copy of your progress is kept on this device (the last 3 days).
// If an app update ever goes wrong, More → Back up progress can put any of them back.
const SNAP_KEY = 'kanji_srs_snapshots';
function snapshots() { try { return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; } catch (e) { return []; } }
function takeSnapshot() {
  if (!Object.keys(appData.cards).length) return;
  let list = snapshots();
  if (list.some(x => x.date === today())) return;
  list = [{ date: today(), cards: Object.keys(appData.cards).length, data: appData }, ...list].slice(0, 3);
  while (list.length) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(list)); return; } catch (e) { list.pop(); }
  }
}
takeSnapshot();

// ============ SCHEDULING ============
function maxInterval() {
  // Keep every card coming back at least once before exam week.
  const left = daysBetween(today(), appData.settings.examDate) - 7;
  return Math.max(7, Math.min(45, left));
}
function schedule(key, grade) {
  const t = today();
  let c = appData.cards[key];
  const ret = retention();
  if (!c || !c.reps) {   // new, or learned but not yet quizzed
    c = { stability: FSRS.initS(grade), difficulty: FSRS.initD(grade), reps: 1, lapses: grade === 1 ? 1 : 0, lastReview: t };
  } else {
    const elapsed = Math.max(0, daysBetween(c.lastReview || t, t));
    const r = FSRS.R(Math.max(elapsed, 0.5), Math.max(c.stability || 0.5, 0.1));
    c.stability = Math.max(0.1, FSRS.nextS(c.difficulty || 5, c.stability || 0.5, r, grade));
    c.difficulty = FSRS.nextD(c.difficulty || 5, grade);
    c.reps = (c.reps || 0) + 1;
    if (grade === 1) c.lapses = (c.lapses || 0) + 1;
    c.lastReview = t;
  }
  let days = Math.min(maxInterval(), FSRS.interval(c.stability, ret));
  // New cards always come back tomorrow (unless "Easy"): the first overnight check is where most forgetting happens.
  if (c.reps === 1 && grade < 4) days = Math.min(days, 1);
  c.due = addDays(t, days);
  appData.cards[key] = c;
}
function markKnown(key) {
  // "Already know it": skip learning, but check it once in the next 4 weeks (spread out so they don't arrive together).
  const t = today();
  appData.cards[key] = { stability: 25, difficulty: 3, reps: 1, lapses: 0, lastReview: t,
                         due: addDays(t, 4 + Math.floor(Math.random() * 24)), triaged: true };
}
function logReview(passed) {
  const t = today();
  appData.stats.totalReviews++;
  if (passed) appData.stats.correctReviews++;
  appData.history[t] = (appData.history[t] || 0) + 1;
  if (appData.stats.lastReviewDate !== t) {
    appData.stats.streak = appData.stats.lastReviewDate === addDays(t, -1) ? (appData.stats.streak || 0) + 1 : 1;
    appData.stats.lastReviewDate = t;
  }
}
function statusKey(key) {
  const c = appData.cards[key];
  if (!c) return 'new';
  const s = c.stability || 0;
  if ((c.lapses || 0) >= 3 && s < 7) return 'struggling';
  if (s < 3) return 'learning';
  if (s < 21) return 'good';
  return 'mastered';
}
function status(k) { return statusKey(k.kanji); }
function recall(c) {
  // Estimated chance you still remember this card today (FSRS retrievability).
  return FSRS.R(Math.max(0.5, daysBetween(c.lastReview || today(), today())), Math.max(0.1, c.stability || 0.1));
}
// A word unlocks once every kanji in it has passed its next-day check (or was marked as already known).
function kanjiReady(ch) { const c = appData.cards[ch]; return !!c && (c.triaged || (c.reps || 0) >= 2); }
// Kana-only words and words with kanji above N3 are studied by sound and meaning, so they never wait on kanji.
function vform(v) { return v.f || 'kanji'; }
function unlocked(type, x) { return type !== 'vocab' || vform(x) !== 'kanji' || x.k.every(kanjiReady); }
function unseenOf(type) { return deckOf(type).filter(x => !appData.cards[keyOf(type, x)]); }
function unseen() { return unseenOf('kanji'); }
function dueOf(type) {
  const t = today();
  // Lowest recall chance first, so if you stop early you've rescued the cards closest to being forgotten.
  return deckOf(type).filter(x => { const c = appData.cards[keyOf(type, x)]; return c && c.due <= t; })
    .sort((a, b) => recall(appData.cards[keyOf(type, a)]) - recall(appData.cards[keyOf(type, b)]));
}
function dueReviews() { return dueOf('kanji'); }
function studyDaysLeft() { return Math.max(1, daysBetween(today(), finishNewBy())); }
function suggestedNew() { return planToday().target.kanji; }

// ============ DAILY PLAN ============
// The plan is in minutes, not cards: weekdays and weekends each get their own budget (More → Settings).
// Each day, reviews due come first; the time left is filled with new cards. What's left of each deck is
// spread over the days until "all new cards done", weekend days weighted by their extra time, so a missed
// or short day just raises the next days a little.
function isWeekend(d) { const w = new Date(d + 'T12:00:00').getDay(); return w === 0 || w === 6; }
function minutesOn(d) { const st = appData.settings; return Math.max(5, +(isWeekend(d) ? st.minWeekend : st.minWeekday) || 30); }
function dayWeight(d) { return minutesOn(d) / Math.max(5, +appData.settings.minWeekday || 30); }
function weightedDaysLeft() {
  let w = 0;
  for (let d = today(); d < finishNewBy(); d = addDays(d, 1)) w += dayWeight(d);
  return Math.max(dayWeight(today()), w);
}
// Words are ranked by how often they appear in everyday Japanese (p: 1 = most useful, tools/rank_vocab.py).
// The top FOCUS_WORDS are scheduled automatically, best first; the rest wait until those are all started,
// or until you ask for extras.
const FOCUS_WORDS = 1200;
const coreWord = v => (v.p || 9999) <= FOCUS_WORDS;
function planLeft() {
  const coreLeft = unseenOf('vocab').filter(coreWord).length;
  return { kanji: unseenOf('kanji').length, vocab: coreLeft || unseenOf('vocab').length, grammar: unseenOf('grammar').length, coreLeft };
}
// Seconds per card, learned from your own answers. A new card costs its learning screen plus the quiz
// a few cards later and the check the next day.
function timing() {
  const t = Object.assign({ review: 10, learn: 30 }, appData.timing || {});
  return { review: t.review, fresh: t.learn + 2 * t.review };
}
function noteTime(kind, since) {
  if (!since) return;
  const sec = Math.min(90, Math.max(2, (Date.now() - since) / 1000));   // ignore breaks away from the phone
  const t = Object.assign({ review: 10, learn: 30 }, appData.timing);   // a fresh object: never edit one in place
  t[kind] = Math.round((t[kind] * 0.9 + sec * 0.1) * 10) / 10;
  appData.timing = t;
}
// The plan is fixed once per day (and when settings change), so finishing reviews early doesn't keep adding new cards.
let planCache = null;
function planToday() {
  const key = today() + JSON.stringify(appData.settings);
  if (planCache && planCache.key === key) return planCache;
  const left = planLeft(), W = weightedDaysLeft(), w = dayWeight(today()), t = timing();
  const target = {};
  for (const ty of TYPES) target[ty] = left[ty] ? Math.ceil(left[ty] / W * w) : 0;
  if (target.kanji) target.kanji = Math.max(3, target.kanji);
  const due = TYPES.reduce((a, ty) => a + dueOf(ty).length, 0);
  const budget = minutesOn(today()) * 60;
  // Reviews first. The minutes left go to new cards in order of exam value: grammar (cheap, many points),
  // then kanji (words can't be read without them), then words, which always keep at least 30% of the room
  // once some are unlocked. Early on few words are unlocked, so time flows to kanji; later it shifts to words.
  let room = Math.max(0, Math.floor((budget - due * t.review) / t.fresh));
  const wantNew = TYPES.reduce((a, ty) => a + target[ty], 0);
  const wordsReady = unseenOf('vocab').filter(v => (coreWord(v) || !left.coreLeft) && unlocked('vocab', v)).length;
  const limit = {};
  limit.grammar = Math.min(target.grammar, room); room -= limit.grammar;
  const wordFloor = Math.min(target.vocab, wordsReady, Math.floor(room * 0.3));
  limit.kanji = Math.min(target.kanji, Math.max(0, room - wordFloor)); room -= limit.kanji;
  // Spare time on a long day lets words catch up, up to twice their share.

    if (c === 'っ') { out.soku.push(join([...ch.slice(0, i), ...ch.slice(i + 1)])); out.soku.push(join([...ch.slice(0, i), 'く', ...ch.slice(i + 1)])); }

    .filter(ok).sort(() => Math.random() - .5));

function planCardHtml() {

function renderDeckGrid() {
  const t = deckFilter.type;

  if (t === 'kanji') {
    const list = DECK.filter(k => (!deckFilter.level || k.level === deckFilter.level) && (!q ||
      k.kanji.includes(q) || k.keyword.toLowerCase().includes(q) ||
      [...(k.on || []), ...(k.kun || [])].some(r => kata2hira(r).replace(/[.\-]/g, '').includes(hq))));
    $('deck-grid').innerHTML = list.map(k => `<button class="tile st-${status(k)}" data-k="${esc(k.kanji)}" aria-label="${esc(k.kanji)} ${esc(k.keyword)}">

      '<p class="muted">No kanji match that search.</p>';

  if (t === 'vocab') {
    const list = VOCAB.filter(v => !q || v.w.includes(q) || v.r.includes(hq) || v.m.toLowerCase().includes(q)).slice(0, 300);
    $('deck-grid').innerHTML = list.map(v => {

// ============ STUDY SESSION ============
// Queue items: {type, x, mode: 'learn' | 'quiz' | 'triage', again, word, task}
let session = null;

function quizItem(type, x) {
  const c = appData.cards[keyOf(type, x)];
  const reps = c ? c.reps || 0 : 0;
  if (type === 'kanji') {
    // Mature kanji alternate between the bare kanji and a real exam word, because N3 tests readings of words.
    const words = (x.vocab || []).filter(v => v.w.length > 1);
    const useWord = reps >= 2 && words.length && reps % 2 === 0;
    const word = useWord ? words[reps % words.length] : null;
    const traps = word ? readingTraps(word.r) : null;
    return { type, x, mode: 'quiz', word, task: traps ? 'readmc' : null, opts: traps ? shuffle([word.r, ...traps]) : null, answerText: word ? word.r : null };
  }
  if (type === 'vocab') {
    // Alternate exam tasks: 漢字読み (read the kanji word) and 表記 (pick the right kanji spelling).
    // Kanji words rotate three exam tasks: pick the reading (traps on long vowels, っ, ゛), pick the spelling, say it.
    if (vform(x) !== 'kanji') return { type, x, mode: 'quiz', task: 'meaning' };
    const traps = readingTraps(x.r);
    const cycle = reps % 3;
    if (cycle === 1 && x.d && x.d.length === 3) return { type, x, mode: 'quiz', task: 'spell', opts: shuffle([x.w, ...x.d]), answerText: x.w };

// Round-robin merge, so a combined session alternates kanji, words and grammar.

// "Learn 5 more": a mix beyond today's plan, best value first. Words come from the most useful list

function extraMix(n = 5) {
  const planned = new Set(TYPES.flatMap(t => newQueueOf(t).map(x => keyOf(t, x))));
  const fresh = t => newQueueOf(t, 200).filter(x => !planned.has(keyOf(t, x)));

function extraLabel(mix) {

function startStudy(type, extra) {

// Listening drill: hear a word or sentence you've studied, recall the meaning. Practice only; it doesn't change scheduling.
function listenPool() {

  for (const k of DECK) if (appData.cards[k.kanji]) for (const v of k.vocab || []) pool.push({ say: sayText(v.w, v.r), show: v.w, sub: v.r, meaning: v.m });

// ============ SESSION RESUME ============
// The session in progress is kept on this device, so an app update (which reloads the page) or stepping

const SESSION_KEY = 'kanji_srs_session';

function lookup(type, key) {

function packItem(it) {

    const fresh = () => ({ picked: [], pool: shuffle(chunks.map((c, i) => ({ c, i }))) });
    if (it.task === 'order' && !x.order) Object.assign(it, { task: 'fill', order: null });

function partsHtml(o) {
  const rows = o.chunks.map((c, i) => [c, chunkGl(o, i)]).filter(([, gl]) => gl);
  return rows.length ? `<div class="parts-gl">${rows.map(([c, gl]) => `<div><b lang="ja">${esc(c)}</b><span lang="ja">${gl}</span></div>`).join('')}</div>` : '';
}
// The question's English: behind a button until you answer, then shown.
function trHtml(it, en, answered) {
  if (!en) return '';
  return `<div class="tr">${answered || it.showTr ? `<span class="muted">EN</span> ${esc(en)}` : '<button class="small-btn" id="g-tr">Show translation</button>'}</div>`;
}
function grammarScreen(it, tags) {
  const g = it.x;
  tags.push('<span class="tag">GRAMMAR</span>');
  if (it.mode === 'learn') return { inner: { front: '', back: grammarBackHtml(g) }, bar: learnBar };
  const answered = session.revealed;
  const cont = `<div class="row one"><button class="ans ${it.correct ? 'good' : 'again'}" id="a-continue">${it.correct ? 'Correct · continue' : 'Missed · it will come back'}</button></div>`;
  if (it.task === 'fill') {
    tags.push('<span class="tag">文法 · FILL THE BLANK</span>');
    const f = it.f;
    const q = glossHtml(f.q).replace('（　）', `<span class="blank">${answered ? esc(f.choices[f.answer]) : '（　　）'}</span>`);
    const front = `<div class="g-q" lang="ja">${q}</div>
      <div class="opts g${f.choices.some(c => c.length > 4) ? ' long' : ''}">${f.choices.map((o, i) => {
        const cls = !answered ? '' : i === f.answer ? ' right' : i === it.chosen ? ' wrong' : ' dim';
        return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${esc(o)}</button>`;
      }).join('')}</div>
      ${trHtml(it, f.en, answered)}
      ${answered ? `<div class="why">${esc(f.why)} ${sayBtn(f.q.replace('（　）', f.choices[f.answer]))}</div>` : ''}
      ${answered ? wrongsHtml(f, it.chosen) : ''}`;
    return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' },
      bar: answered ? cont : `<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Choose what fits （　）</span></div>` };
  }
  // ★ ordering
  tags.push('<span class="tag">並べ替え · ORDER THE PARTS</span>');
  const o = g.order, st = it.order;
  const slots = [0, 1, 2, 3].map(i => {
    const p = st.picked[i];
    const star = i === o.star ? '<span class="star">★</span>' : '';
    const correctChunk = answered ? o.chunks[i] : null;
    return `<button class="slot${p ? ' filled' : ''}${answered ? (st.picked[i] && st.picked[i].i === i ? ' right' : ' wrong') : ''}" data-slot="${i}" ${answered ? 'disabled' : ''} lang="ja">${star}${answered ? esc(correctChunk) : p ? esc(p.c) : '＿＿'}</button>`;
  }).join('');
  const front = `<div class="g-q order" lang="ja"><span>${glossHtml(o.before)}</span>${slots}<span>${glossHtml(o.after)}</span></div>
    ${answered ? '' : trHtml(it, o.en, false)}
    ${answered ? `<div class="why">${esc(o.en)} ${sayBtn(o.before + o.chunks.join('') + o.after)}</div>${partsHtml(o)}` :
      `<div class="opts chunks">${st.pool.map((p, j) => `<button class="opt${it.showGl ? ' with-gl' : ''}" data-chunk="${j}" lang="ja">${esc(p.c)}${it.showGl ? chunkGl(o, p.i) : ''}</button>`).join('')}</div>
       <div class="prompt">Tap the parts in order. Tap a filled slot to take it back.</div>
       ${(o.cgl || []).some(x => x.length) && !it.showGl ? '<div class="tr"><button class="small-btn" id="g-cgl">Show readings &amp; meanings</button></div>' : ''}`}`;
  return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' }, bar: answered ? cont : '<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Fill all four slots</span></div>' };
}

function answerChoice(i) {
  const it = session.queue[session.i];
  if (session.revealed) return;
  it.chosen = i;
  it.correct = !it.hinted && (it.answerText != null ? it.opts[i] === it.answerText : i === it.f.answer);
  session.revealed = true;
  renderSession();
}
function pickChunk(j) {
  const it = session.queue[session.i], st = it.order;
  const p = st.pool.splice(j, 1)[0];
  const slot = [0, 1, 2, 3].find(i => !st.picked[i]);
  st.picked[slot] = p;
  if (st.picked.filter(Boolean).length === 4) {
    it.correct = st.picked.every((x, i) => x.i === i);
    session.revealed = true;
  }
  renderSession();
}
function unpickSlot(i) {
  const it = session.queue[session.i], st = it.order;
  if (!st.picked[i]) return;
  st.pool.push(st.picked[i]); st.picked[i] = undefined;
  renderSession();
}

function renderRoundBreak() {
  const left = session.queue.length - session.i;
  $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">休</span></div>
    <h2 style="margin-top:14px">Round done: ${session.done} answered</h2>
    <p class="muted">${left} more in this session, about ${Math.max(1, Math.round(left * timing().review / 60))} min. Stopping here is fine: they'll be waiting, most urgent first.</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row two"><button class="ans skip" id="s-finish">Stop for now</button><button class="ans next" id="r-more">Keep going</button></div>`;
}
function remainingToday() {
  return TYPES.map(t => ({ t, n: dueOf(t).length + newQueueOf(t).length })).filter(x => x.n);
}
function renderSessionEnd() {
  const triage = session.kind === 'triage';
  if (session.kind === 'listen') {
    $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
      <div class="cell" style="margin:0 auto"><span class="k" lang="ja">聴</span></div>
      <h2 style="margin-top:14px">${session.heard} of ${session.queue.length} understood</h2>
      <p class="muted">Anything you missed by ear but know on paper is a listening gap. Replay those words out loud a few times.</p></div></div>`;
    $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
    return;
  }
  $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">${triage ? '済' : '終'}</span></div>
    <h2 style="margin-top:14px">${triage ? 'Triage done' : 'Session done'}</h2>
    <p class="muted">${triage ? `Unseen kanji left to learn: ${unseen().length}. The daily plan now uses that number.`
      : `${session.done} cards answered. ${remainingToday().length ? 'Still to do today: ' + remainingToday().map(x => `${TYPE_LABEL[x.t]} ${x.n}`).join(' · ') + '.' : "That's everything for today."}`}</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
}

function grade(g) {
  const it = session.queue[session.i];
  noteTime('review', session.shownAt);
  if (!it.again) {
    // First answer for this card in this session counts for scheduling.
    schedule(keyOf(it.type, it.x), g);
    logReview(g > 1);
  }
  session.done++;
  if (g === 1) insertLater(Object.assign(quizItem(it.type, it.x), { again: true }), 4);
  saveData();
  next();
}
function next() {
  const it = session.queue[session.i];
  if (it && it.mode !== 'triage') (session.history = session.history || []).push(it);
  session.i++; session.revealed = false; session.shownAt = Date.now();
  // Long sessions come in rounds of 50: a natural place to stop, or a nudge to keep going.
  if (session.kind === 'study' && session.done && session.done % ROUND === 0 && session.done !== session.lastPause && session.i < session.queue.length) {
    session.lastPause = session.done; session.paused = true;
  }
  renderSession();
}
// Look back at cards already done this session (‹ button or swipe right). Read-only: nothing is re-graded.
function backFor(it) {
  if (it.type === 'kanji') return backHtml(it.x, 'learn');
  if (it.type === 'vocab') return vocabBackHtml(it.x);
  if (it.type === 'grammar') return grammarBackHtml(it.x);
  return `<div class="listen-text${it.x.sentence ? ' sentence' : ''}" lang="ja">${it.x.sentence ? glossHtml(it.x.show) : esc(it.x.show)}</div><div class="keyword" style="font-size:17px">${esc(it.x.meaning)}</div>`;
}
function showHistory(idx) {
  const h = session.history || [];
  if (!h.length) return;
  idx = Math.max(0, Math.min(h.length - 1, idx));
  $('modal-body').innerHTML = `<div class="stack">
    <div class="row-wrap" style="justify-content:space-between">
      <div class="row-wrap" style="gap:6px"><button class="icon-btn" data-hist="${idx - 1}" ${idx === 0 ? 'disabled' : ''} aria-label="Earlier card">‹</button>
      <button class="icon-btn" data-hist="${idx + 1}" ${idx === h.length - 1 ? 'disabled' : ''} aria-label="Later card">›</button>
      <span class="eyebrow">${h.length - idx} back</span></div>
      <button class="icon-btn" id="modal-close" aria-label="Back to the current card">✕</button></div>
    <div class="card">${backFor(h[idx])}</div></div>`;
  $('modal').hidden = false;
  $('modal').dataset.hist = idx;
}

function triageAnswer(known) {
  const it = session.queue[session.i];
  const k = it.x.kanji;
  session.undo.push({ k, prevCard: appData.cards[k], prevTri: appData.triaged[k] });
  appData.triaged[k] = known ? 'known' : 'unknown';
  if (known) markKnown(k);
  saveData();
  session.done++;
  next();
}
function triageUndo() {
  const u = session.undo.pop(); if (!u) return;
  if (u.prevCard) appData.cards[u.k] = u.prevCard; else delete appData.cards[u.k];
  if (u.prevTri) appData.triaged[u.k] = u.prevTri; else delete appData.triaged[u.k];
  saveData();
  session.i = Math.max(0, session.i - 1); session.revealed = false; session.done--;
  renderSession();
}

// ============ EVENTS ============
document.addEventListener('click', e => {
  if (!e.target.closest('[data-gl], [data-kt], [data-part], #gl-pop')) $('gl-pop').hidden = true;
  const t = e.target.closest('button, [data-k]');
  if (!t) { if (e.target === $('modal')) $('modal').hidden = true; return; }
  if (t.dataset.say !== undefined) { e.stopPropagation(); return speak(t.dataset.say); }
  if (t.dataset.gl) { e.stopPropagation(); return showGloss(t); }
  if (t.dataset.kt && t.closest('.sheet')) { e.stopPropagation(); return showKanjiPop(t); }
  if (t.dataset.part) { e.stopPropagation(); return showPart(t); }
  if (t.dataset.openK) { $('gl-pop').hidden = true; return showDetail(t.dataset.openK); }
  if (t.dataset.hist !== undefined) return showHistory(+t.dataset.hist);
  if (t.id === 's-prev') return showHistory((session.history || []).length - 1);
  const id = t.id;
  if (t.closest('#tabs')) { view = t.dataset.view; confirmingReset = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.k && !t.closest('.sheet')) return showDetail(t.dataset.k);
  if (t.dataset.k && t.closest('.sheet')) return;
  if (t.dataset.v) { const v = BY_WORD[t.dataset.v]; if (v) showModal('v:' + v.w, vocabBackHtml(v)); return; }
  if (t.dataset.gId) { const g = BY_GID[t.dataset.gId]; if (g) showModal('g:' + g.id, grammarBackHtml(g)); return; }
  if (t.dataset.dtype) { deckFilter.type = t.dataset.dtype; deckFilter.q = ''; render(); return; }
  if (t.dataset.lv !== undefined) { deckFilter.level = +t.dataset.lv; render(); return; }
  if (t.dataset.snap !== undefined) { const x = snapshots()[+t.dataset.snap]; if (x) restore(JSON.stringify(x.data)); return; }
  if (t.dataset.study) return startStudy(t.dataset.study);
  if (t.id === 'go-extra') { const mix = extraMix(); if (mix.length) runQueue([], mix, 'all'); return; }
  if (t.dataset.g) return grade(+t.dataset.g);
  if (t.dataset.opt !== undefined) return answerChoice(+t.dataset.opt);
  if (t.dataset.chunk !== undefined) return pickChunk(+t.dataset.chunk);
  if (t.dataset.slot !== undefined) return unpickSlot(+t.dataset.slot);
  switch (id) {
    case 'go-triage': return startTriage();
    case 'go-all': return startStudy('all');
    case 'go-reviews': return runQueue(interleave(TYPES.map(t => dueOf(t).map(x => quizItem(t, x)))), [], 'all');
    case 'go-weak': return startWeak();
    case 'go-listen': return startListen();
    case 'l-yes': session.heard++; session.done++; return next();
    case 'l-no': session.done++; return next();
    case 'quick-backup': return quickBackup();
    case 'hide-home-tip': appData.hideHomeTip = true; saveData(); return render();
    case 's-close': case 's-finish': return closeSheet();
    case 'go-resume': return resumeSession();
    case 'a-reveal': session.revealed = true; return renderSession();
    case 'r-more': session.paused = false; return renderSession();
    case 'g-tr': session.queue[session.i].showTr = true; return renderSession();
    case 'g-cgl': session.queue[session.i].showGl = true; return renderSession();
    case 'a-continue': { const it = session.queue[session.i]; return grade(it.correct ? 3 : 1); }
    case 'a-learned': {
      const it = session.queue[session.i];
      noteTime('learn', session.shownAt);
      // Extras are on top of today's plan, so they don't use up its new cards (tomorrow's plan counts them).
      const dk = it.extra ? today() + '|extra' : dayKey(it.type);
      appData.newByDay[dk] = (appData.newByDay[dk] || 0) + 1;
      // Saved as learned straight away (due today), so closing the app before its quiz doesn't lose it.
      const key = keyOf(it.type, it.x);
      if (!appData.cards[key]) appData.cards[key] = { stability: 0, difficulty: 0, reps: 0, lapses: 0, lastReview: today(), due: today() };
      saveData();
      insertLater(quizItem(it.type, it.x), 3);
      return next();
    }
    case 'a-known': {
      const it = session.queue[session.i];
      markKnown(keyOf(it.type, it.x));
      saveData();
      return next();
    }
    case 't-yes': return triageAnswer(true);
    case 't-no': return triageAnswer(false);
    case 't-peek': session.revealed = true; return renderSession();
    case 't-undo': return triageUndo();
    case 'modal-close': $('modal').hidden = true; return;
    case 'b-copy': return copyBackup();
    case 'b-restore': return restore($('backup').value);
    case 'r-ask': confirmingReset = true; return render();
    case 'r-no': confirmingReset = false; return render();
    case 'r-yes': appData = emptyData(); appData.settingsAt = Date.now(); saveData(); confirmingReset = false; view = 'today'; return render();
    case 'dl-json': return downloadFile(`n3-progress-${today()}.json`, JSON.stringify(appData, null, 1));
    case 'dl-csv': return downloadFile(`n3-stats-${today()}.csv`, statsCsv());
    case 'dl-days': return downloadFile(`n3-daily-${today()}.csv`, dailyCsv());
  }
});
// Swipe right during a session to look at the previous card.
let touch0 = null;
document.addEventListener('touchstart', e => { if (session && e.touches.length === 1) touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0 || !session) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  touch0 = null;
  if (dx > 80 && Math.abs(dy) < 50) {
    if ($('modal').hidden) showHistory((session.history || []).length - 1);
    else showHistory(+($('modal').dataset.hist || 0) - 1);
  } else if (dx < -80 && Math.abs(dy) < 50 && !$('modal').hidden) {
    const i = +($('modal').dataset.hist || 0);
    if (i >= (session.history || []).length - 1) $('modal').hidden = true; else showHistory(i + 1);
  }
}, { passive: true });
document.addEventListener('input', e => {
  if (e.target.id === 'deck-search') { deckFilter.q = e.target.value; renderDeckGrid(); }
});
document.addEventListener('change', e => {
  const st = appData.settings;
  if (/^set-/.test(e.target.id)) appData.settingsAt = Date.now();
  const num = v => String(Math.max(0, parseInt(v, 10) || 0));
  if (e.target.id === 'set-exam' && e.target.value) { st.examDate = e.target.value; saveData(); }
  if (e.target.id === 'set-new') { const v = e.target.value.trim(); st.newPerDay = v === '' ? 'auto' : num(v); saveData(); render(); }
  if (e.target.id === 'set-vocab') { const v = e.target.value.trim(); st.vocabPerDay = v === '' ? 'auto' : num(v); saveData(); render(); }
  if (e.target.id === 'set-minwd') { st.minWeekday = Math.min(240, Math.max(5, parseInt(e.target.value, 10) || 30)); saveData(); render(); }
  if (e.target.id === 'set-minwe') { st.minWeekend = Math.min(300, Math.max(5, parseInt(e.target.value, 10) || 60)); saveData(); render(); }
  if (e.target.id === 'set-grammar') { const v = e.target.value.trim(); st.grammarPerDay = v === '' ? 'auto' : num(v); saveData(); render(); }
  if (e.target.id === 'set-buffer') { st.bufferDays = Math.min(30, Math.max(0, parseInt(e.target.value, 10) || 0)); saveData(); render(); }
  if (e.target.id === 'b-file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(e.target.files[0]); }
});
document.addEventListener('keydown', e => {
  if (!session || e.target.matches('input, textarea')) return;
  if (session.paused) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); session.paused = false; renderSession(); } return; }
  const it = session.queue[session.i];
  if (!it) { if (e.key === 'Enter' || e.key === ' ') closeSheet(); return; }
  if (e.key === 'Escape') return closeSheet();
  const choice = it.mode === 'quiz' && ['spell', 'fill', 'readmc'].includes(it.task);
  if (it.mode === 'listen') { if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; renderSession(); } else if (session.revealed && (e.key === '1' || e.key === '2')) $(e.key === '1' ? 'l-no' : 'l-yes').click(); return; }
  if (it.mode === 'learn' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); $('a-learned').click(); }
  else if (it.mode === 'triage') { if (e.key === 'ArrowRight' || e.key === 'k') triageAnswer(true); if (e.key === 'ArrowLeft' || e.key === 'n') triageAnswer(false); }
  else if (choice && !session.revealed && '1234'.includes(e.key)) answerChoice(+e.key - 1);
  else if ((choice || it.task === 'order') && session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); grade(it.correct ? 3 : 1); }
  else if (!choice && it.task !== 'order' && !session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; renderSession(); }
  else if (!choice && it.task !== 'order' && session.revealed && '1234'.includes(e.key)) grade(+e.key);
});

// ============ DOWNLOADS ============
function csvCell(x) { const s = String(x == null ? '' : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function statsCsv() {
  const rows = [['deck', 'item', 'reading', 'meaning', 'status', 'memory_strength_days', 'difficulty', 'reviews', 'misses', 'last_review', 'next_review', 'recall_chance_now']];
  const add = (type, key, item, reading, meaning) => {
    const c = appData.cards[key];
    rows.push([TYPE_LABEL[type], item, reading, meaning, statusKey(key), c ? r3(c.stability) : '', c ? r3(c.difficulty) : '', c ? c.reps || 0 : 0,
      c ? c.lapses || 0 : 0, c ? c.lastReview || '' : '', c ? c.due || '' : '', c ? Math.round(recall(c) * 100) + '%' : '']);
  };
  for (const k of DECK) add('kanji', k.kanji, k.kanji, [...(k.on || []), ...(k.kun || [])].join(' / '), k.keyword);
  for (const v of VOCAB) add('vocab', 'v:' + v.w, v.w, v.r, v.m);
  for (const g of GRAMMAR) add('grammar', 'g:' + g.id, g.pattern, '', g.meaning);
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n');   // BOM so Excel reads the Japanese correctly
}
function dailyCsv() {
  const days = Object.keys(appData.history).sort();
  const rows = [['date', 'reviews', 'new_kanji', 'new_words', 'new_grammar']];
  for (const d of days) rows.push([d, appData.history[d] || 0, appData.newByDay[d] || 0, appData.newByDay[d + '|vocab'] || 0, appData.newByDay[d + '|grammar'] || 0]);
  return '\ufeff' + rows.map(r => r.join(',')).join('\n');
}
async function downloadFile(filename, text) {
  const msg = $('dl-msg');
  const say = t => { if (msg) msg.textContent = t; };
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); } say(`Saved ${filename}.`); }
    catch (e) { say(e && e.code === 'declined' ? 'Download cancelled.' : 'This view cannot save files. Use Copy backup instead.'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); }
    say(`Downloaded ${filename}.`);
  } catch (e) { say('This browser blocked the download. Use Copy backup instead.'); }
}

function quickBackup() {
  appData.lastBackup = today(); saveData();
  const txt = JSON.stringify(appData);
  const done = () => { render(); const n = $('backup-note'); if (n) n.textContent = 'Backup copied. Paste it into a note or an email to yourself.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { view = 'more'; render(); copyBackup(); });
  else { view = 'more'; render(); copyBackup(); }
}
function copyBackup() {
  appData.lastBackup = today(); saveData();
  const txt = JSON.stringify(appData);
  const ta = $('backup'); ta.value = txt;
  const msg = $('b-msg');
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = 'Backup is in the box above, selected. Copy it with your device\'s Copy command.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Backup copied. Paste it into a note or email to yourself.'; }, fallback);
  } else fallback();
}
function restore(txt) {
  const msg = $('b-msg');
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d.cards !== 'object') throw new Error('no cards');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    appData = loadData();
    appData.settingsAt = Date.now();
    scheduleSync();
    msg.textContent = `Restored ${Object.keys(appData.cards).length} cards.`;
  } catch (e) {
    msg.textContent = 'That text is not a backup from this app. Copy the whole backup, starting with { and ending with }.';
  }
}

// ============ BOOT ============
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
const getJson = (f, optional) => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); }).catch(err => { if (optional) return []; throw err; });
Promise.all([getJson('kanji.json'), getJson('vocab.json', true), getJson('grammar.json', true)]).then(([kd, vd, gd]) => {
  DECK = kd.cards;
  CAST = kd.cast || {};
  CAST_NOTE = kd.castNote || '';
  PARTS = kd.parts || {};
  BY_KANJI = Object.fromEntries(DECK.map(k => [k.kanji, k]));
  VOCAB = vd; BY_WORD = Object.fromEntries(VOCAB.map(v => [v.w, v]));
  GRAMMAR = gd; BY_GID = Object.fromEntries(GRAMMAR.map(g => [g.id, g]));
  for (const g of GRAMMAR) Object.assign(GL, g.gl || {});
  render();
  restoreSession();
  initSync();
  // Example sentences for words are large, so they load after the app is already usable.
  getJson('examples.json', true).then(ex => {
    if (!ex || Array.isArray(ex)) return;
    EXAMPLES = ex;
    for (const list of Object.values(ex)) for (const [ja, , gl] of list) if (gl && gl.length) GL[ja] = gl;
  });
}).catch(() => {
  $('app').innerHTML = '<div class="loading">The deck file (kanji.json) did not load. If you opened this file directly from disk, serve the folder instead: python3 -m http.server</div>';
});
</script>
</body>
</html>
