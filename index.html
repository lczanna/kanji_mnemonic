<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>N3 Kanji Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one thumb-reach column, fixed bottom tabs; study runs as a full-screen sheet.
   Kanji are set in Mincho because that is the typeface the JLPT paper prints them in. */
:root {
  --paper: #eef1f6;
  --surface: #fbfcfe;
  --ink: #18202f;
  --muted: #5a6477;
  --line: #d3d9e4;
  --ai: #2b4a8b;          /* aizome indigo, the accent */
  --ai-soft: #dde5f3;
  --again: #c4471b;
  --hard: #a86f12;
  --good: #23784f;
  --easy: #2a68aa;
  --grid: #e3a49a;        /* genkō yōshi practice-grid red */
  --font-kanji: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
    --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
    --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
  --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
  --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- bottom tabs ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs button { background: none; border: 0; padding: 10px 4px 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button .jp { font-family: var(--font-kanji); font-size: 20px; line-height: 1.1; font-weight: 800; }
.tabs button[aria-current="page"] { color: var(--ai); }

/* ---------- today ---------- */
.today-head { display: grid; gap: 4px; margin-bottom: 18px; }
.countdown { display: flex; align-items: baseline; gap: 10px; }
.countdown .big { font-family: var(--font-kanji); font-weight: 800; font-size: 56px; line-height: 1; color: var(--ai); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: grid; gap: 14px; }
.levels { display: grid; gap: 12px; }
.level-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.level-row .lv { font-weight: 700; }
.bar { height: 10px; border-radius: 6px; background: var(--ai-soft); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .s-known { background: var(--ai); }
.bar .s-learning { background: color-mix(in srgb, var(--ai) 45%, var(--ai-soft)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.cta { display: grid; gap: 10px; }
.opt-notes .right-note { border-left-color: var(--good); color: var(--ink); }
.kl { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 1px dotted color-mix(in srgb, var(--ai) 60%, transparent); cursor: pointer; }
.word-link { font-size: 12px; padding: 2px 8px; margin-left: 6px; }
.missed-words { display: grid; gap: 4px; font-size: 14px; }
.tk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tk { display: grid; gap: 2px; align-content: start; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.tk-n { font-size: 12px; color: var(--muted); }
.tk-v { font-size: 22px; }
.tk-s { font-size: 11px; color: var(--muted); line-height: 1.35; }
.tk-week { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
.more-ways summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 2px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 14px 16px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--surface); }
.btn.primary .muted { color: color-mix(in srgb, var(--surface) 75%, var(--ai)); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn .count { font-family: var(--font-kanji); font-weight: 800; font-size: 26px; line-height: 1; }
.btn .label { display: grid; gap: 2px; }
.btn .label b { font-size: 16px; }
.btn .label small { font-size: 12px; }
.small-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.small-btn.danger { color: var(--again); border-color: color-mix(in srgb, var(--again) 50%, var(--line)); }
.plan-line { font-size: 13px; color: var(--muted); }
.plan-card { gap: 8px; }
.plan-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plan-top b { font-size: 16px; }
.pace { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; font-size: 13px; align-items: baseline; }
.pace .ok { color: var(--good); } .pace .behind { color: var(--again); }

/* ---------- study sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }
.sheet-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 18px; }
.progress { height: 6px; background: var(--ai-soft); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ai); transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.card-front { display: grid; justify-items: center; gap: 10px; padding-block: 10px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); }
.tag.new { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.tag.relearn { background: color-mix(in srgb, var(--again) 15%, var(--surface)); color: var(--again); }

/* genkō yōshi cell: the square with dashed centre guides used on kanji practice sheets */
.cell {
  width: min(62vw, 230px); aspect-ratio: 1; max-width: 100%; position: relative;
  border: 2px solid var(--grid); display: grid; place-items: center;
  background:
    linear-gradient(var(--grid), var(--grid)) center / 100% 1px no-repeat,
    linear-gradient(var(--grid), var(--grid)) center / 1px 100% no-repeat;
}
.cell::before { content: ""; position: absolute; inset: 0; background: var(--surface); opacity: .55; }
.cell .k { position: relative; font-family: var(--font-kanji); font-weight: 800; font-size: min(46vw, 170px); line-height: 1; }
.word-front { font-family: var(--font-kanji); font-weight: 800; font-size: clamp(44px, 15vw, 72px); line-height: 1.15; padding: 18px 22px; border: 2px solid var(--grid); text-align: center; display: grid; gap: 4px; max-width: 100%; }
.word-front span { font-family: var(--font-body); font-weight: 500; font-size: 20px; color: var(--ai); }
.word-front.revealed { font-size: 40px; padding: 8px 16px; }
.prompt { font-size: 13px; color: var(--muted); text-align: center; }

.back { display: grid; gap: 14px; }
.headline { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.headline .k-small { font-family: var(--font-kanji); font-weight: 800; font-size: 64px; line-height: 1; }
.keyword { font-size: 22px; font-weight: 700; line-height: 1.2; }
.meaning { font-size: 13px; color: var(--muted); }
/* Reviews show the whole picture, just smaller (cropping it cut off heads and hands). */
.card-img.small { width: 82%; max-width: 340px; margin: 0 auto; }
.card-img { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; display: block; background: var(--ai-soft); }
.story { font-size: 16px; line-height: 1.65; }
.story .kw { color: var(--ai); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.story .prim { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; border-bottom: 2px solid color-mix(in srgb, var(--ai) 35%, transparent); }
.story .prim:hover, .story .prim:focus-visible { background: var(--ai-soft); }
button.chip { background: none; font: inherit; font-size: 12px; cursor: pointer; }
.part-of { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.part-of .chip { color: var(--ink); }
.story .snd { font-weight: 700; color: var(--hard); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.section-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.sound { display: grid; gap: 6px; }
.sound-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--hard) 10%, var(--surface)); }
.sound-row .r { font-weight: 700; font-size: 16px; min-width: 3.2em; }
.readings { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.readings dt { font-weight: 700; color: var(--muted); font-size: 12px; padding-top: 2px; }
.readings dd { margin: 0; min-width: 0; }
.vocab { display: grid; gap: 0; }
.vocab-row { display: grid; grid-template-columns: minmax(0, auto) 1fr; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.vocab-row:first-child { border-top: 0; }
.vocab-row .w { font-family: var(--font-kanji); font-weight: 800; font-size: 20px; line-height: 1.2; }
.vocab-row .rd { font-size: 14px; color: var(--ai); font-weight: 500; align-self: end; }
.vocab-row .m { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.answer-bar .row { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); }
.answer-bar .row.one { grid-template-columns: 1fr; }
.answer-bar .row.two { grid-template-columns: 1fr 1fr; }
.ans { border: 0; border-radius: 12px; padding: 12px 4px; font-weight: 700; display: grid; gap: 1px; justify-items: center; color: var(--surface); }
.ans small { font-weight: 400; font-size: 11px; opacity: .85; }
.ans.again { background: var(--again); } .ans.hard { background: var(--hard); }
.ans.good { background: var(--good); } .ans.easy { background: var(--easy); }
.ans.reveal, .ans.next { background: var(--ai); }
.ans.skip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

/* ---------- deck ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--surface); }
.search { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font: inherit; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 2px 5px; display: grid; justify-items: center; gap: 0; position: relative; }
.tile .k { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.15; }
.tile .kwd { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 3px; }
.tile::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.tile.st-learning::after { background: var(--hard); }
.tile.st-struggling::after { background: var(--again); }
.tile.st-good::after { background: var(--good); }
.tile.st-mastered::after { background: var(--ai); }

/* ---------- stats ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi .v { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.1; }
.kpi .l { font-size: 12px; color: var(--muted); }
.forecast { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 110px; }
.forecast .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; min-width: 0; }
.forecast .b { width: 100%; background: var(--ai); border-radius: 3px 3px 0 0; min-height: 2px; }
.forecast .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.forecast .d { font-size: 10px; color: var(--muted); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; }
.heat i { width: 12px; height: 12px; border-radius: 2px; background: var(--ai-soft); }
.heat i.l1 { background: color-mix(in srgb, var(--ai) 30%, var(--ai-soft)); }
.heat i.l2 { background: color-mix(in srgb, var(--ai) 55%, var(--ai-soft)); }
.heat i.l3 { background: color-mix(in srgb, var(--ai) 80%, var(--ai-soft)); }
.heat i.l4 { background: var(--ai); }
.leech-list { display: flex; flex-wrap: wrap; gap: 6px; }
.leech { border: 1px solid color-mix(in srgb, var(--again) 40%, var(--line)); background: var(--surface); border-radius: 10px; padding: 4px 10px; font-family: var(--font-kanji); font-weight: 800; font-size: 22px; }

/* ---------- more ---------- */
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="number"], input[type="date"] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cast div { font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.cast b { display: inline-block; min-width: 3em; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--ai-soft); }
.confirm { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--again); }

.modal { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; align-items: end; }
.modal-body { background: var(--paper); max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 560px; margin: 0 auto; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
/* ---------- words & grammar ---------- */
.say { border: 1px solid var(--line); background: var(--surface); color: var(--ai); border-radius: 999px; width: 28px; height: 28px; font-size: 11px; display: inline-grid; place-items: center; vertical-align: middle; padding: 0; }
.word-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.word-head .w { font-family: var(--font-kanji); font-weight: 800; font-size: 44px; line-height: 1.1; }
.word-head .w.kana { font-family: var(--font-body); font-weight: 700; font-size: 36px; }
.kform { font-family: var(--font-kanji); font-weight: 800; color: var(--ink); font-size: 16px; }
.word-head .rd { font-size: 20px; color: var(--ai); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.parts { display: grid; gap: 6px; }
.part { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.part .k { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; color: var(--ink); line-height: 1.1; }
.g-head .pattern { font-family: var(--font-kanji); font-weight: 800; font-size: 30px; line-height: 1.2; }
.g-note { margin: 0; font-size: 14px; color: var(--muted); }
.examples { display: grid; gap: 10px; }
.ex .ja { font-size: 17px; line-height: 1.6; }
.ex .en { font-size: 13px; color: var(--muted); }
.ex .sense { font-size: 12px; color: var(--hard); margin-top: 2px; }
.word-front.kana { font-family: var(--font-body); font-weight: 700; white-space: nowrap; max-width: 100%; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-size: 20px; font-family: var(--font-kanji); font-weight: 800; text-align: left; min-width: 0; }
.opt .num { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--again); background: color-mix(in srgb, var(--again) 14%, var(--surface)); }
.opt.dim { opacity: .5; }
.opt-w { display: grid; line-height: 1.15; }
.opt-w small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--muted); }
.opt[disabled] { cursor: default; }
.chunks .opt { font-size: 17px; justify-content: center; }
.chunks .opt.with-gl { display: grid; justify-items: center; gap: 2px; }
.cgl { font-family: var(--font-body); font-weight: 400; font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; }
.cgl b { color: var(--ai); font-weight: 500; }
.parts-gl { width: 100%; display: grid; gap: 6px; }
.parts-gl div { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; border-left: 3px solid var(--line); padding-left: 8px; }
.parts-gl b { font-size: 16px; }
.parts-gl .cgl { text-align: left; font-size: 13px; }
.opts.g .opt, .chunks .opt { font-family: var(--font-body); font-weight: 700; font-size: 17px; }
.opts.g.long { grid-template-columns: 1fr; }
.g-q { font-size: 19px; line-height: 1.9; width: 100%; }
.g-q .blank { display: inline-block; padding: 0 6px; border-bottom: 2px solid var(--ai); color: var(--ai); font-weight: 700; }
.g-q.order { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.slot { position: relative; min-width: 64px; border: 1px dashed var(--ai); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 16px; }
.slot.filled { border-style: solid; }
.slot.right { border: 1px solid var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.slot.wrong { border: 1px solid var(--again); background: color-mix(in srgb, var(--again) 14%, var(--surface)); }
.slot .star { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--hard); }

// Same key as the previous app, so existing progress (keyed by kanji character) carries over.
const STORAGE_KEY = 'kanji_srs_data';
function emptyData() {
  return { version: 3, cards: {}, triaged: {}, newByDay: {}, history: {},

           lookSeen: {}, confusions: {}, sprintBest: 0, practice: {}, mocks: [], repaired: {}, historyOk: {}, calib: {}, calibK: null, timeLog: { review: [], learn: [] }, planDay: null, studySec: {}, hookSeen: {},

  const base = emptyData();
  if (!d || typeof d !== 'object') return base;

  d.settings = Object.assign(base.settings, d.settings || {});
  d.stats = Object.assign(base.stats, d.stats || {});

  if (!d.settingsAt && d.settings.vocabPerDay === '25') d.settings.vocabPerDay = 'auto';
  earlyKnownChecks(d);
  easyFirstChecks(d);

let storageOk = true;

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function saveData() { saveLocal(); scheduleSync(); }

// ============ CLOUD SYNC (Claude link only) ============
// On the claude.ai link, progress is also saved to the viewer's private database, so it survives
// cleared browser data and follows them across devices. Elsewhere this stays off and the app is local-only.
// Cards are packed and split across 4 documents to stay well under the 256 KB document limit.
const SYNC = { db: null, uid: null, state: 'local', at: null, pushed: {}, timer: null, busy: false, again: false,
  waiting: false, failed: false, anyway: false, listening: false };

    planStart: d.planStart || null, timing: d.timing || null,

    practice: d.practice || {}, mocks: d.mocks || [], historyOk: d.historyOk || {}, calib: d.calib || {}, calibK: d.calibK || null,

// Only answers still waiting to be sent go out: a page that hasn't changed anything (say an old tab left open)

function flushNow() { if (SYNC.db && SYNC.timer) { clearTimeout(SYNC.timer); SYNC.timer = null; flushSync(); } }

  if (SYNC.busy) { SYNC.again = true; return; }

    const bodies = syncBodies();
    for (const [name, body] of Object.entries(bodies)) {
      const str = JSON.stringify(body);

function newerCard(a, b) {

  const ra = a.reps || 0, rb = b.reps || 0;

  const m = remote.meta;

  for (const [day, n] of Object.entries(m.newByDay || {})) d.newByDay[day] = Math.max(d.newByDay[day] || 0, n);

  d.stats.totalReviews = Math.max(d.stats.totalReviews || 0, rs.totalReviews || 0);
  d.stats.correctReviews = Math.max(d.stats.correctReviews || 0, rs.correctReviews || 0);

// Pictures load from images/n3/. The Claude link can't hold one file per card, so there they come
// from packs of about 30 instead (tools/pack_images.py); images/packs/index.json names each picture's pack
// (kanji by character, word pictures by word id).
let packIndex = null;
const packs = {};
// A pack is about 1 MB: on a patchy phone connection the first try can fail, so each load gets three tries.
async function packFor(k) {
  for (let i = 0; ; i++) {
    let n = null;
    try {
      packIndex = packIndex || getJson('images/packs/index.json');
      n = (await packIndex)[k];
      if (n == null) return null;   // not packed
      packs[n] = packs[n] || getJson(`images/packs/p${String(n).padStart(2, '0')}.json`);
      return (await packs[n])[k] || null;
    } catch (e) {

}
async function imgFallback(img) {

  } catch (e) { img.remove(); }
}
// Fetch the packs holding the pictures of a session's new cards ahead of time, one at a time.
function warmPacks(keys) {
  keys.reduce((p, k) => p.then(() => packFor(k)).catch(() => {}), Promise.resolve());

// Short and long readings are different characters (キョ the Kyoto maiko, キョウ the Kyoto Geisha): each names the other.
function castSibling(r) {
  const long = CAST[r + 'ウ'], short = r.endsWith('ウ') && CAST[r.slice(0, -1)];
  const [len, other, c] = long ? ['short', r + 'ウ', long] : short ? ['long', r.slice(0, -1), short] : [];
  return c ? ` <small class="muted">· ${len} vowel; <span lang="ja">${esc(other)}</span> is the ${esc(c.hook)}</small>` : '';
}
// Picked a reading that only differs by a long vowel (きょうねん for きょねん): which kanji is short or long, and its character.
const kata = t => t.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

  const right = it.answerText, picked = it.opts[it.chosen], w = it.word || it.x;
  if (!picked || picked === right || !w) return '';

  const longPicked = drop(picked, right);

    .map(([ch, kr]) => { const r = kata(kr), c = CAST[r], sib = CAST[r.endsWith('ウ') ? r.slice(0, -1) : r + 'ウ'];
      return c && sib ? `<div><b lang="ja">${esc(ch)}</b> is <span lang="ja">${esc(kr)}</span>: ${esc(c.emoji || '')} ${esc(c.hook)}, not the ${esc(sib.hook)}</div>` : ''; }).join('');

// ============ BONUS: THE BEST USE OF 10 SPARE MINUTES ============
// When today's plan is done, the main button picks one thing, in order of exam value per minute:
// catch up if you're truly behind; repair cards you keep missing (hook and picture first, then a check that
// doesn't move their schedule); exam practice if it's light or weak; new cards only while accuracy is healthy.
// Reviewing healthy cards early is never picked: it gains almost nothing per minute.
const LEECH_LAPSES = 3;
function leechKeys(n = 10) {
  const t = today();
  return Object.entries(appData.cards).filter(([k, c]) => !/^[pc]:/.test(k) && (c.lapses || 0) >= LEECH_LAPSES && appData.repaired[k] !== t)
    .map(([k]) => k).sort((a, b) => (appData.cards[b].lapses - appData.cards[a].lapses) || (recall(appData.cards[a]) - recall(appData.cards[b]))).slice(0, n);
}
const typeOfKey = k => k.startsWith('v:') ? 'vocab' : k.startsWith('g:') ? 'grammar' : 'kanji';
function startRepair() {
  const xs = leechKeys().map(k => ({ type: typeOfKey(k), x: lookup(typeOfKey(k), k) })).filter(a => a.x);
  const learn = xs.map(a => ({ type: a.type, x: a.x, mode: 'learn', repair: true }));
  const check = xs.map(a => Object.assign(quizItem(a.type, a.x), { practiceOnly: true }));
  const queue = [];
  learn.forEach((l, i) => { queue.push(l); if (i >= 2) queue.push(check[i - 2]); });
  queue.push(...check.slice(Math.max(0, learn.length - 2)));
  if (!queue.length) return;
  session = { queue, i: 0, revealed: false, done: 0, kind: 'study', type: 'all' };
  openSheet();
}
function practiceThisWeek() {
  const from = addDays(today(), -6);
  return Object.values(appData.practice).filter(r => r.d >= from).length;
}
function bonusPick() {
  const extra = extraMix(), bh = behindBy();
  if (TYPES.some(t => bh[t]) && extra.length) return { label: `catch up ${extraLabel(extra)}`, run: () => runQueue([], extra, 'all') };
  const leeches = leechKeys();
  if (leeches.length) return { label: `repair ${leeches.length} card${leeches.length > 1 ? 's' : ''} you keep missing (story and picture first)`, run: startRepair };
  const acc = appData.stats.totalReviews >= 50 ? appData.stats.correctReviews / appData.stats.totalReviews : 1;
  const pl = practiceAccuracy('listen'), pr = practiceAccuracy('read');
  const practiceWeak = practiceThisWeek() < 20 || (pl != null && pl < 70) || (pr != null && pr < 70);
  if (EXAM.qr.length && (practiceWeak || acc < 0.85)) return { label: 'extra listening & reading practice', run: () => runQueue(practiceItems(true), [], 'all') };
  if (extra.length) return { label: `learn ${extraLabel(extra)}`, run: () => runQueue([], extra, 'all') };
  return EXAM.qr.length ? { label: 'extra listening & reading practice', run: () => runQueue(practiceItems(true), [], 'all') } : null;
}
function mockBtn() {
  const done = new Set(appData.mocks.filter(m => m.src === 'app').map(m => m.set)), next = EXAM.mocks.find(m => !done.has(m.id)) || EXAM.mocks[0];
  return `<button class="btn" id="go-mock" data-set="${esc(next.id)}"><span class="label"><b><span lang="ja">模擬試験</span> Practice exam ${esc(next.id)}</b><small class="muted">${mockDue() ? "It's practice test week: " : ''}full timed N3 mock, 30 + 70 + 40 minutes, scored like the real test${done.size ? ` · done: ${[...done].join(', ')}` : ''}. Leave and resume any time.</small></span><span class="count num">2h20</span></button>`;
}
function planCardHtml() {
  const p = planToday(), st = planStatus(), lim = p.limit;
  const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString('en', { month: 'short', day: 'numeric' });
  // Per deck: today's target and how much of it is done, then where you stand against the whole plan.
  const row = (label, ty) => {
    const s = st[ty];
    if (!s || !s.start) return '';
    const done = appData.newByDay[dayKey(ty)] || 0, goal = lim[ty];
    const overall = s.diff > 0 ? `<span class="ok">${s.diff} ahead</span>` : s.diff < 0 ? `<span class="behind">${-s.diff} behind</span>` : '<span class="ok">on pace</span>';
    const extra = Math.max(0, Math.min(p.catchUp[ty], goal - p.pace[ty]));
    const why = extra ? ` <small class="muted">(incl. +${extra} to catch up)</small>` : ty === 'vocab' && p.waiting > 0 ? ` <small class="muted">(${p.waiting} more wait for their kanji)</small>` : '';
    return `<span>${label}</span><span class="num ${goal && done >= goal ? 'ok' : ''}">${done}/${goal}${why}</span><span class="num">${overall}</span>`;
  };
  return `<div class="panel stack plan-card">

}

// "Which one?": the meaning (and a word with the kanji blanked out), pick the kanji among its look-alikes.
function whichItem(x, extra) {

// ============ STUDY SESSION ============
// Queue items: {type, x, mode: 'learn' | 'quiz' | 'triage', again, word, task}
let session = null;

function quizItem(type, x) {
  if (type === 'part') return { type, x, mode: 'quiz' };
  const c = appData.cards[keyOf(type, x)];
  const reps = c ? c.reps || 0 : 0;
  if (type === 'kanji') {
    // Every third check (from the second) of a kanji with a started look-alike: pick it among its look-alikes.
    if (reps >= 2 && reps % 3 === 2 && peersOf(x.kanji).some(c => (appData.cards[c] || {}).reps >= 1)) return whichItem(x);
    // Mature kanji alternate between the bare kanji and a real exam word, because N3 tests readings of words.
    // Only words whose other kanji you've started: a word with an unknown kanji (首都 before 都) tests guessing,
    // and a miss would count against this kanji. Kanji above N3 count as unknown.
    const words = (x.vocab || []).filter(v => v.w.length > 1 && [...v.w].every(ch => !isKanji(ch) || ch === '々' || ch === x.kanji || appData.cards[ch]));
    const useWord = reps >= 2 && words.length && reps % 2 === 0;
    const word = useWord ? words[reps % words.length] : null;
    const traps = word ? readingTraps(word.r) : null;
    return { type, x, mode: 'quiz', word, task: traps ? 'readmc' : null, opts: traps ? shuffle([word.r, ...traps]) : null, answerText: word ? word.r : null };
  }
  if (type === 'vocab') {
    // Alternate exam tasks: 漢字読み (read the kanji word) and 表記 (pick the right kanji spelling).
    // Kanji words rotate three exam tasks: pick the reading (traps on long vowels, っ, ゛), pick the spelling, say it.
    // From the second review, every fourth check uses one of the exam's other word questions when there is one:
    // 文脈規定 (which word fits the sentence), 言い換え (closest meaning), 用法 (which sentence uses it right).
    // Only questions you can mostly read: at most 2 words you haven't studied (a few unknowns are fine, you guess
    // from context as in the exam; a sentence full of them is just guessing). The easiest sentence is picked.
    const ex = EXAM.vocab[x.w];
    if (ex && reps >= 2 && reps % 4 === 3) {
      const texts = (k, q) => k === 'ctx' ? [q.s] : k === 'para' ? [q.s, ...q.options] : q.options;
      const cands = ['ctx', 'para', 'usage'].flatMap(k => (k === 'ctx' ? ex.ctx || [] : ex[k] ? [ex[k]] : [])
        .map(q => ({ k, q, n: texts(k, q).reduce((a, t) => a + unknownWords(t, x.w), 0) }))).filter(c => c.n <= 2);
      const kinds = [...new Set(cands.map(c => c.k))];
      const kind = kinds[Math.floor(reps / 4) % Math.max(1, kinds.length)];
      const pick = cands.filter(c => c.k === kind).sort((a, b) => a.n - b.n || Math.random() - .5)[0];
      if (pick) return { type, x, mode: 'quiz', task: kind, q: pick.q, opts: pick.q.options, answerText: pick.q.options[pick.q.answer] };
    }
    if (vform(x) !== 'kanji') return { type, x, mode: 'quiz', task: 'meaning' };
    const traps = readingTraps(x.r);
    const cycle = reps % 3;
    if (cycle === 1 && x.d && x.d.length === 3) return { type, x, mode: 'quiz', task: 'spell', opts: shuffle([x.w, ...x.d]), answerText: x.w };
    if (cycle !== 2 && traps) return { type, x, mode: 'quiz', task: 'readmc', opts: shuffle([x.r, ...traps]), answerText: x.r };
    return { type, x, mode: 'quiz', task: 'read' };
  }
  // Grammar: mostly fill-in-the-blank, every third review a ★ sentence-ordering task.
  const task = reps % 3 === 2 && x.order ? 'order' : 'fill';
  const f = x.fill[Math.floor(Math.random() * x.fill.length)];
  const order = task === 'order' ? { picked: [], pool: shuffle(x.order.chunks.map((c, i) => ({ c, i }))) } : null;
  return { type, x, mode: 'quiz', task, f, order };
}

// Round-robin merge, so a combined session alternates kanji, words and grammar.
function interleave(lists) {
  const out = [], ls = lists.map(l => l.slice());
  while (ls.some(l => l.length)) for (const l of ls) if (l.length) out.push(l.shift());
  return out;
}
// "Learn 5 more": a mix beyond today's plan, best value first. Words come from the most useful list
// (the low-value ones only once every useful word you can read has been started), kanji in deck order,
// and a grammar point while any are left. Anything already planned for today is skipped.
function extraMix(n = 5) {
  const planned = new Set(TYPES.flatMap(t => newQueueOf(t).map(x => keyOf(t, x))));
  const fresh = t => newQueueOf(t, 200).filter(x => !planned.has(keyOf(t, x)));
  const g = fresh('grammar'), w = fresh('vocab'), k = fresh('kanji');
  const pool = { kanji: k, vocab: w, grammar: g }, take = { kanji: 0, vocab: 0, grammar: 0 };
  const room = t => take[t] < pool[t].length;
  let left = n;
  // Behind on the plan: extras go there first, one at a time to whichever type is furthest behind.
  const need = behindBy();
  for (let t; left && (t = TYPES.filter(t => need[t] > take[t] && room(t)).sort((a, b) => (need[b] - take[b]) - (need[a] - take[a]))[0]); left--) take[t]++;
  // Otherwise (or once caught up) the usual mix: a grammar point, two words, the rest kanji, then more words.
  for (const [t, cap] of [['grammar', 1], ['vocab', 2], ['kanji', n], ['vocab', n]])
    while (left && take[t] < cap && room(t)) { take[t]++; left--; }
  const item = type => x => ({ type, x, mode: 'learn', extra: true });
  return interleave([k.slice(0, take.kanji).map(item('kanji')), w.slice(0, take.vocab).map(item('vocab')),
    g.slice(0, take.grammar).map(item('grammar'))]);
}
// How many cards each deck is behind the plan's straight line to "all new cards done" (0 when on track).

      bar: session.revealed ? continueBar(it) : pickHint('Watch for long vowels, small っ and ゛') };
  }
  const front = showBack && it.mode !== 'triage' ? (word ? `<div class="word-front revealed" lang="ja">${esc(word.w)}<span>${esc(word.r)}</span></div>` : '')
    : word ? `<div class="word-front" lang="ja">${kanjiTapHtml(word.w)}</div><div class="prompt">Read this word aloud (exam style), then tap to check. Tap a kanji for a hint.</div>`
    : `<div class="cell"><span class="k" lang="ja">${esc(k.kanji)}</span></div><div class="prompt">${prompt}</div>`;
  const back = showBack ? backHtml(k, it.mode === 'learn' ? 'learn' : 'quiz') : '';
  let bar;
  if (it.mode === 'learn') bar = learnBar;
  else if (it.mode === 'triage') {
    const btns = [session.undo.length ? `<button class="ans skip" id="t-undo">Undo</button>` : '',
      session.revealed ? '' : `<button class="ans skip" id="t-peek">Peek</button>`,
      `<button class="ans again" id="t-no">Not yet</button>`, `<button class="ans good" id="t-yes">Know it</button>`].filter(Boolean);
    bar = `<div class="row" style="grid-template-columns:repeat(${btns.length}, 1fr)">${btns.join('')}</div>`;
  } else bar = session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>`;
  return { inner: { front, back }, bar };
}

// Word options are shown in one script: when some are kana only (a word you studied in kana, like あんない), the
// others are shown in kana too, or the odd one out gives the answer away.
const HAS_KANJI = /[\u3400-\u9fff々]/;
function kanaOf(o, w) {
  const v = BY_WORD[w];
  if (v && v.w === o) return v.r;
  let out = '', pos = 0;
  for (const [st, len, r] of GL[o] || []) { if (st < pos) continue; out += o.slice(pos, st) + (r || o.slice(st, st + len)); pos = st + len; }
  out += o.slice(pos);
  return HAS_KANJI.test(out) ? null : out;
}
function sameScript(opts, words) {
  const k = opts.map(o => HAS_KANJI.test(o));
  if (k.every(Boolean) || !k.some(Boolean)) return opts;
  const kana = opts.map((o, i) => k[i] ? kanaOf(o, (words || [])[i]) : o);
  // Kana would make sound-alike options identical (効く and 聞く are both きく): keep them as written then.
  return kana.every(Boolean) && new Set(kana).size === kana.length ? kana : opts;
}
function mcOptions(it, kana, kanji, q) {
  const answered = session.revealed;
  const shown = q ? sameScript(it.opts, q.w) : it.opts;
  return `<div class="opts${kana ? ' kana-opts' : ''}${kanji ? ' kanji-opts' : ''}">${it.opts.map((o, i) => {
    const plain = shown[i] !== o;   // shown in kana: no reading needed
    o = shown[i];
    const cls = !answered ? '' : it.opts[i] === it.answerText ? ' right' : i === it.chosen ? ' wrong' : ' dim';
    // Word questions: an option with a kanji you haven't studied yet shows its reading.
    const rd = q && !plain && unstudied(o) && optReading(o, (q.w || [])[i]);
    return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${rd ? `<span class="opt-w">${esc(o)}<small>${esc(rd)}</small></span>` : esc(o)}</button>`;
  }).join('')}</div>`;
}
function continueBar(it) {
  return `<div class="row one"><button class="ans ${it.correct ? 'good' : 'again'}" id="a-continue">${it.correct ? 'Correct · continue' : it.hinted ? 'Hint used · it will come back' : 'Missed · it will come back'}</button></div>`;
}
// "Pick the spelling": after answering, what each wrong option is. The kanji it swaps in (with keywords),
// and when it's a real word, which word it is: the homophones the exam uses as traps.
function spellNotes(it) {
  const v = it.x, kw = ch => BY_KANJI[ch] ? `${ch} (${BY_KANJI[ch].keyword})` : ch;
  const rows = it.opts.map((o, i) => [o, i]).filter(([o]) => o !== v.w).sort(([, a], [, b]) => (b === it.chosen) - (a === it.chosen)).map(([o, i]) => {
    const swaps = [];
    if (o.length === v.w.length) for (let j = 0; j < o.length; j++) { if (o[j] !== v.w[j]) swaps.push(`${kw(o[j])} instead of ${kw(v.w[j])}`); }
    else swaps.push(`kanji ${[...o].filter(c => !v.w.includes(c)).map(kw).join(', ')}`);
    const other = BY_WORD[o] ? `${BY_WORD[o].r} · ${BY_WORD[o].m}` : (v.dx || {})[o];
    const what = other ? `A different word: ${other}.` : 'Not a real word.';
    return `<div class="${i === it.chosen ? 'picked' : ''}"><b lang="ja">${esc(o)}</b>${esc(what)} It uses <span lang="ja">${esc(swaps.join('; '))}</span>.</div>`;
  });
  return rows.length ? `<div class="wrongs">${rows.join('')}</div>` : '';
}
const pickHint = t => `<div class="row one"><span class="muted" style="text-align:center;font-size:13px">${t}</span></div>`;

// Kanji you haven't started yet (no card), including ones above N3.
const unstudied = o => [...o].some(c => c !== '々' && isKanji(c) && !appData.cards[c]);
// How an option is read: the deck word's reading, else built from its tap glosses (readings of each word in it).
function optReading(o, w) {
  const v = BY_WORD[w || o];
  if (v && v.w === o) return v.r;
  const gl = GL[o];
  if (!gl || !gl.length) return '';
  let out = '', pos = 0;
  for (const [st, len, r] of gl) { if (st < pos) continue; out += o.slice(pos, st) + r; pos = st + len; }
  out += o.slice(pos);
  return [...out].some(isKanji) ? '' : hira(out);
}
// Word questions: the sentence is tappable (reading and meaning of each word); the blank or underline stays.
const ctxHtml = s => glossHtml(s).replace('（　）', '<span class="blank">（　　）</span>');
const paraHtml = s => glossHtml(s).replace('【', '<u>').replace('】', '</u>');
// After answering: every option with its reading and meaning, the one you picked first. Options printed in kana
// (kanji above N3) show their written form too.
function optionNotes(q, chosen) {
  if (!q) return '';
  // The right answer gets a tick; a wrong one, why it doesn't fit this sentence (when the question has that note).
  const tail = i => i === q.answer ? ' <span class="ok">✓</span>' : (q.wrong || {})[i] ? `<br><span class="why-not">${esc(q.wrong[i])}</span>` : '';
  const rows = q.options.map((o, i) => {
    const v = BY_WORD[(q.w || [])[i] || o], cls = i === chosen && i !== q.answer ? 'picked' : i === q.answer && q.wrong ? 'right-note' : '';
    if (v) {
      const head = o === v.w ? `${kanjiLinks(v.w)} <span class="muted">${esc(v.r)}</span>` : `${esc(o)} <span class="muted">(written ${kanjiLinks(v.w)})</span>`;
      return `<div class="${cls}"><b lang="ja">${head}</b> · ${esc(v.m)}${wordLink(v.w)}${tail(i)}</div>`;
    }
    // Not a deck word (a conjugated form like 続けて, or a phrase): its words' readings and meanings.
    const gl = GL[o] || [];
    const rd = optReading(o);
    const parts = gl.map(([st, len, r, lemma, lr, m]) => `${gl.length > 1 ? `<span lang="ja">${esc(o.slice(st, st + len))}</span>: ` : ''}${esc(m || '')}${lemma !== o.slice(st, st + len) ? ` <span lang="ja">(${esc(lemma)})</span>` : ''}${wordLink(BY_WORD[lemma] ? lemma : o.slice(st, st + len))}`);
    if (!gl.length && !(q.opts_en || [])[i]) return '';
    return `<div class="${cls}"><b lang="ja">${esc(o)}${rd && rd !== o ? ` <span class="muted">${esc(rd)}</span>` : ''}</b> · ${(q.opts_en || [])[i] ? esc(q.opts_en[i]) : parts.join('; ')}${tail(i)}</div>`;
  }).filter(Boolean);
  return rows.length ? `<div class="wrongs${q.wrong ? ' opt-notes' : ''}">${rows.join('')}</div>` : '';
}

function vocabScreen(it, tags) {

      : it.task === 'para' ? `<div class="g-q" lang="ja">${paraHtml(q.s)}</div><div class="prompt">Which is closest in meaning to the underlined part?</div>`

    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },

    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },

  }

    if (session.revealed) speak(sayText(v.w, v.r));
    const front = session.revealed ? '' : `<div class="word-front kana" lang="ja" style="${kanaSize(v.r)}">${esc(v.r)}</div><div class="prompt">Say what it means, then tap to check. ${sayBtn(sayText(v.w, v.r), 'Play ' + v.r)}</div>${soundTwins(v).length ? `<div class="prompt muted" lang="ja">not ${soundTwins(v).map(o => esc(o.w)).join(' · ')}</div>` : ''}`;
    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },

  if (session.revealed) speak(sayText(v.w, v.r));

    bar: session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>` };

// Words in a sentence you couldn't read: a deck word you haven't started, or a word with a kanji you haven't learned.
// Kana words count as known (mostly grammar), and so does the word being tested.
function unknownWords(text, tested) {
  let n = 0;
  for (const [, , , lemma] of GL[text] || []) {
    if (!HAS_KANJI.test(lemma) || lemma === tested) continue;
    const v = BY_WORD[lemma];
    if (v ? appData.cards['v:' + lemma] || (v.k || []).every(ch => appData.cards[ch]) : [...lemma].filter(ch => BY_KANJI[ch]).every(ch => appData.cards[ch]) && [...lemma].every(ch => !HAS_KANJI.test(ch) || BY_KANJI[ch])) continue;
    n++;
  }
  return n;
}
// Ordering task: readings and meanings of the words in a chunk, shown only when asked for.
function chunkGl(o, i, links) {
  const words = (o.cgl || [])[i] || [];
  // links: after answering, each deck kanji can be tapped (not inside the part buttons, which are buttons themselves)
  return words.length ? `<span class="cgl">${words.map(([w, r, m]) => `${links ? kanjiLinks(w) : esc(w)}${r && r !== w ? ` <b>${esc(r)}</b>` : ''} · ${esc(m)}${links ? wordLink(w) : ''}`).join('<br>')}</span>` : '';
}
// After answering: why each wrong option doesn't fit, the one you picked first.
function wrongsHtml(f, chosen) {
  const w = f.wrong || {};
  const idx = f.choices.map((_, i) => i).filter(i => i !== f.answer && w[f.choices[i]])
    .sort((a, b) => (b === chosen) - (a === chosen));
  return idx.length ? `<div class="wrongs">${idx.map(i => `<div class="${i === chosen ? 'picked' : ''}"><b lang="ja">${esc(f.choices[i])}</b>${esc(w[f.choices[i]])}</div>`).join('')}</div>` : '';
}
// After an ordering task: each part in the right order, with the readings and meanings of its words.
function partsHtml(o) {
  const rows = o.chunks.map((c, i) => [c, chunkGl(o, i, true)]).filter(([, gl]) => gl);
  return rows.length ? `<div class="parts-gl">${rows.map(([c, gl]) => `<div><b lang="ja">${kanjiLinks(c)}</b><span lang="ja">${gl}</span></div>`).join('')}</div>` : '';
}
// The question's English: behind a button until you answer, then shown.
function trHtml(it, en, answered) {
  if (!en) return '';

}
function grammarScreen(it, tags) {
  const g = it.x;
  tags.push('<span class="tag">GRAMMAR</span>');
  if (it.mode === 'learn') return { inner: { front: '', back: grammarBackHtml(g) }, bar: learnBar };
  if (it.mode === 'hook') {
    tags.push('<span class="tag">NEW MEMORY HOOK</span>');
    return { inner: { front: '', back: grammarBackHtml(g) }, bar: `<div class="row one"><button class="ans next" id="a-hook">Got it</button></div>` };
  }
  const answered = session.revealed;
  const cont = `<div class="row one"><button class="ans ${it.correct ? 'good' : 'again'}" id="a-continue">${it.correct ? 'Correct · continue' : it.hinted ? 'Translation used · it will come back' : 'Missed · it will come back'}</button></div>`;
  if (it.task === 'fill') {
    tags.push('<span class="tag">文法 · FILL THE BLANK</span>');
    const f = it.f;
    const q = glossHtml(f.q).replace('（　）', `<span class="blank">${answered ? esc(f.choices[f.answer]) : '（　　）'}</span>`);
    const front = `<div class="g-q" lang="ja">${q}</div>
      <div class="opts g${f.choices.some(c => c.length > 4) ? ' long' : ''}">${f.choices.map((o, i) => {
        const cls = !answered ? '' : i === f.answer ? ' right' : i === it.chosen ? ' wrong' : ' dim';
        return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${esc(o)}</button>`;
      }).join('')}</div>
      ${trHtml(it, f.en, answered)}
      ${answered ? `<div class="why">${esc(f.why)} ${sayBtn(f.q.replace('（　）', f.choices[f.answer]))}</div>` : ''}
      ${answered ? wrongsHtml(f, it.chosen) : ''}`;
    return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' },
      bar: answered ? cont : `<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Choose what fits （　）</span></div>` };
  }
  // ★ ordering
  tags.push('<span class="tag">並べ替え · ORDER THE PARTS</span>');
  const o = g.order, st = it.order;
  const slots = [0, 1, 2, 3].map(i => {
    const p = st.picked[i];
    const star = i === o.star ? '<span class="star">★</span>' : '';
    const correctChunk = answered ? o.chunks[i] : null;
    return `<button class="slot${p ? ' filled' : ''}${answered ? (st.picked[i] && st.picked[i].i === i ? ' right' : ' wrong') : ''}" data-slot="${i}" ${answered ? 'disabled' : ''} lang="ja">${star}${answered ? esc(correctChunk) : p ? esc(p.c) : '＿＿'}</button>`;
  }).join('');
  const front = `<div class="g-q order" lang="ja"><span>${glossHtml(o.before)}</span>${slots}<span>${glossHtml(o.after)}</span></div>
    ${answered ? '' : trHtml(it, o.en, false)}
    ${answered ? `<div class="why">${esc(o.en)} ${sayBtn(o.before + o.chunks.join('') + o.after)}</div>${partsHtml(o)}` :
      `<div class="opts chunks">${st.pool.map((p, j) => {
        // Readings and meanings only on request ("Show readings & meanings"): no help unless you ask for it.
        const gl = it.showGl && chunkGl(o, p.i);
        return `<button class="opt${gl ? ' with-gl' : ''}" data-chunk="${j}" lang="ja">${esc(p.c)}${gl || ''}</button>`; }).join('')}</div>
       <div class="prompt">Tap the parts in order. Tap a filled slot to take it back.</div>
       ${(o.cgl || []).some(x => x.length) && !it.showGl ? '<div class="tr"><button class="small-btn" id="g-cgl">Show readings &amp; meanings</button></div>' : ''}`}`;
  return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' }, bar: answered ? cont : '<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Fill all four slots</span></div>' };
}

function answerChoice(i) {
  const it = session.queue[session.i];
  if (session.revealed) return;
  it.chosen = i;
  it.correct = !it.hinted && (it.answerText != null ? it.opts[i] === it.answerText : i === it.f.answer);
  if (it.task === 'which' && !it.correct) { noteConfusion(it.answerText, it.opts[i]); saveData(); }
  session.revealed = true;
  if (it.sprint) {
    if (it.correct) session.score++;
    renderSession();
    // A right answer moves on at once; a wrong one stays a moment so you can see the difference.
    setTimeout(() => { if (session && session.queue[session.i] === it) { session.i++; session.revealed = false; renderSession(); } }, it.correct ? 300 : 1600);
    return;
  }
  renderSession();
}
function pickChunk(j) {
  const it = session.queue[session.i], st = it.order;
  const p = st.pool.splice(j, 1)[0];
  const slot = [0, 1, 2, 3].find(i => !st.picked[i]);
  st.picked[slot] = p;
  if (st.picked.filter(Boolean).length === 4) {
    it.correct = !it.hinted && st.picked.every((x, i) => x.i === i);
    session.revealed = true;
  }
  renderSession();
}
function unpickSlot(i) {
  const it = session.queue[session.i], st = it.order;
  if (!st.picked[i]) return;
  st.pool.push(st.picked[i]); st.picked[i] = undefined;
  renderSession();
}

}

  }

    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">${triage ? '済' : '終'}</span></div>
    <h2 style="margin-top:14px">${triage ? 'Triage done' : 'Session done'}</h2>
    <p class="muted">${triage ? `Unseen kanji left to learn: ${unseen().length}. The daily plan now uses that number.`
      : `${session.done} cards answered. ${remainingToday().length ? 'Still to do today: ' + remainingToday().map(x => `${TYPE_LABEL[x.t]} ${x.n}`).join(' · ') + '.' : "That's everything for today."}`}</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
}

function grade(g) {
  const it = session.queue[session.i];
  if (it.drill) { drillResult(it); saveData(); session.done++; return next(); }   // practice: no card is rescheduled
  if (it.lookCheck) { session.done++; return next(); }   // the quick check after a look-alike lesson: practice only
  if (it.practiceOnly) {   // a repair check: practice only, so an early "Good" doesn't push the card's review away
    session.done++;
    if (g === 1) insertLater(Object.assign(quizItem(it.type, it.x), { practiceOnly: true, again: true }), 4);
    return next();
  }
  if (it.pairCard) {   // a look-alike pair card: its own schedule, not the kanji's
    if (!it.again) { schedule(it.pairCard, g); logReview(g > 1); }
    session.done++;
    if (g === 1) { const again = pairItem(it.pairCard.slice(2), { again: true }); if (again) insertLater(again, 4); }
    saveData();
    return next();
  }
  noteTime('review', session.shownAt);
  if (!it.again) {
    // First answer for this card in this session counts for scheduling.
    schedule(keyOf(it.type, it.x), g);
    logReview(g > 1);
  }
  session.done++;
  if (g === 1) insertLater(Object.assign(quizItem(it.type, it.x), { again: true }), 4);
  saveData();
  next();
}
function next() {
  stopAudio();
  const it = session.queue[session.i];
  if (it && it.mode !== 'triage') (session.history = session.history || []).push(it);
  noteStudy(session.shownAt);
  session.i++; session.revealed = false; session.shownAt = Date.now();
  // Long sessions come in rounds of 50: a natural place to stop, or a nudge to keep going.
  if (session.kind === 'study' && session.done && session.done % ROUND === 0 && session.done !== session.lastPause && session.i < session.queue.length) {
    session.lastPause = session.done; session.paused = true;
  }
  renderSession();
}
// Look back at cards already done this session (‹ button or swipe right). Read-only: nothing is re-graded.
function backFor(it) {
  if (it.type === 'kanji') return backHtml(it.x, 'learn');
  if (it.type === 'part') return partBackHtml(it.x);
  if (it.type === 'vocab') return vocabBackHtml(it.x);
  if (it.type === 'grammar') return grammarBackHtml(it.x);
  if (it.type === 'exam') return `<div class="passage" lang="ja">${esc(it.x.text || it.x.line || (it.x.turns || []).map(t => t.t).join(' / '))}</div>`;
  return `<div class="listen-text${it.x.sentence ? ' sentence' : ''}" lang="ja">${it.x.sentence ? glossHtml(it.x.show) : esc(it.x.show)}</div><div class="keyword" style="font-size:17px">${esc(it.x.meaning)}</div>`;
}
function showHistory(idx) {
  const h = session.history || [];
  if (!h.length) return;
  idx = Math.max(0, Math.min(h.length - 1, idx));
  $('modal-body').innerHTML = `<div class="stack">
    <div class="row-wrap" style="justify-content:space-between">
      <div class="row-wrap" style="gap:6px"><button class="icon-btn" data-hist="${idx - 1}" ${idx === 0 ? 'disabled' : ''} aria-label="Earlier card">‹</button>
      <button class="icon-btn" data-hist="${idx + 1}" ${idx === h.length - 1 ? 'disabled' : ''} aria-label="Later card">›</button>
      <span class="eyebrow">${h.length - idx} back</span></div>
      <button class="icon-btn" id="modal-close" aria-label="Back to the current card">✕</button></div>
    <div class="card">${backFor(h[idx])}</div></div>`;

function triageAnswer(known) {
  const it = session.queue[session.i];
  const k = it.x.kanji;
  session.undo.push({ k, prevCard: appData.cards[k], prevTri: appData.triaged[k] });
  appData.triaged[k] = known ? 'known' : 'unknown';
  if (known) markKnown(k);
  saveData();
  session.done++;
  next();
}
function triageUndo() {
  const u = session.undo.pop(); if (!u) return;
  if (u.prevCard) appData.cards[u.k] = u.prevCard; else delete appData.cards[u.k];
  if (u.prevTri) appData.triaged[u.k] = u.prevTri; else delete appData.triaged[u.k];
  saveData();
  session.i = Math.max(0, session.i - 1); session.revealed = false; session.done--;
  renderSession();
}

    case 'go-weak': return startWeak();

    case 'a-look': {
      const it = session.queue[session.i], g = groupById(it.group);
      appData.lookSeen[it.group] = today(); saveData();
      // Straight after the lesson: up to three quick "which one?" questions on this group (practice, not scheduled).
      const gk = g ? deckOnly(g.kanji) : [];
      if (g && gk.length >= 2) shuffle(gk.slice()).slice(0, 3).forEach((c, n) => {
        const q = whichItem(BY_KANJI[c], { lookCheck: true }); q.opts = shuffle(gk.slice(0, 4).includes(c) ? gk.slice(0, 4) : [c, ...gk.filter(x => x !== c).slice(0, 3)]);
        session.queue.splice(session.i + 1 + n, 0, q);

    case 'e-next': session.done++; return next();
    case 'm-next': return mockStep(1);
    case 'm-back': return mockStep(-1);

document.addEventListener('keydown', e => {

function csvCell(x) { const s = String(x == null ? '' : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function statsCsv() {
  const rows = [['deck', 'item', 'reading', 'meaning', 'status', 'memory_strength_days', 'difficulty', 'reviews', 'misses', 'last_review', 'next_review', 'recall_chance_now']];
  const add = (type, key, item, reading, meaning) => {
    const c = appData.cards[key];
    rows.push([TYPE_LABEL[type], item, reading, meaning, statusKey(key), c ? r3(c.stability) : '', c ? r3(c.difficulty) : '', c ? c.reps || 0 : 0,
      c ? c.lapses || 0 : 0, c ? c.lastReview || '' : '', c ? c.due || '' : '', c ? Math.round(recall(c) * 100) + '%' : '']);
  };
  for (const k of DECK) add('kanji', k.kanji, k.kanji, [...(k.on || []), ...(k.kun || [])].join(' / '), k.keyword);
  for (const v of VOCAB) add('vocab', 'v:' + v.w, v.w, v.r, v.m);
  for (const g of GRAMMAR) add('grammar', 'g:' + g.id, g.pattern, '', g.meaning);
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n');   // BOM so Excel reads the Japanese correctly
}
function dailyCsv() {
  const days = Object.keys(appData.history).sort();
  const rows = [['date', 'reviews', 'new_kanji', 'new_words', 'new_grammar']];
  for (const d of days) rows.push([d, appData.history[d] || 0, appData.newByDay[d] || 0, appData.newByDay[d + '|vocab'] || 0, appData.newByDay[d + '|grammar'] || 0]);
  return '\ufeff' + rows.map(r => r.join(',')).join('\n');
}
async function downloadFile(filename, text) {
  const msg = $('dl-msg');
  const say = t => { if (msg) msg.textContent = t; };
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); } say(`Saved ${filename}.`); }
    catch (e) { say(e && e.code === 'declined' ? 'Download cancelled.' : 'This view cannot save files. Use Copy backup instead.'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); }
    say(`Downloaded ${filename}.`);
  } catch (e) { say('This browser blocked the download. Use Copy backup instead.'); }
}

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { view = 'more'; render(); copyBackup(); });
  else { view = 'more'; render(); copyBackup(); }

function restore(txt) {

  }
}

    if (!ex || Array.isArray(ex)) return;
    EXAM = Object.assign({ qr: [], dlg: [], read: [], vocab: {} }, ex);
    for (const x of EXAM.read) for (const [ja, gl] of Object.entries(x.gl || {})) GL[ja] = gl;
    for (const x of [...EXAM.qr, ...EXAM.dlg, ...(EXAM.mock_items || []), ...(EXAM.mock_listen || []), ...(EXAM.mocks || []).flatMap(m => [...m.read, ...m.gram.fill, m.gram.textgram].filter(Boolean))])
      for (const [ja, gl] of Object.entries(x.gl || {})) GL[ja] = gl;
    for (const q of [...Object.values(EXAM.vocab), ...(EXAM.mocks || []).map(m => m.vocab)])
      for (const x of [...(q.ctx || []), ...[].concat(q.para || [], q.usage || [])]) Object.assign(GL, x.gl || {});
    planCache = null;
    if (!session) render();
  });
  // Look-alike groups and their stroke drawings load in the background too.
  getJson('lookalikes.json', true).then(gs => {
    if (!Array.isArray(gs) || !gs.length) return;
    // Deck kanji and part cards (shown, not quizzed); a group needs at least two deck kanji.
    LOOK = gs.map(g => Object.assign(g, { kanji: g.kanji.filter(c => BY_KANJI[c] || BY_PART[c]) })).filter(g => deckOnly(g.kanji).length >= 2); LOOK_BY = {};
    for (const g of gs) for (const c of g.kanji) (LOOK_BY[c] = LOOK_BY[c] || []).push(g);
    if (!session) render();
  });
  // Example sentences for words are large, so they load after the app is already usable.
  getJson('examples.json', true).then(ex => {
    if (!ex || Array.isArray(ex)) return;
    EXAMPLES = ex;
    for (const list of Object.values(ex)) for (const [ja, , gl] of list) if (gl && gl.length) GL[ja] = gl;
    // A word card already on screen (say, a review resumed after an update) gets its sentences now.
    const it = session && session.queue[session.i];
    if (it && it.type === 'vocab' && EXAMPLES[it.x.w]) { const y = $('sheet').scrollTop; renderSession(); $('sheet').scrollTop = y; }
  });
}).catch(() => {
  $('app').innerHTML = '<div class="loading">The deck file (kanji.json) did not load. If you opened this file directly from disk, serve the folder instead: python3 -m http.server</div>';
});
</script>
</body>
</html>
