function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return; }
  if (!saved || saved.day !== today() || !saved.s) return;
  const s = saved.s;
  // Keep the place: count dropped cards before the current one so the index still points at the same card.
  const cur = s.queue[s.i];
  s.queue = s.queue.map(unpackItem);
  s.i = cur ? s.queue.slice(0, s.i).filter(Boolean).length : s.i;
  s.queue = s.queue.filter(Boolean);
  s.history = (s.history || []).map(unpackItem).filter(Boolean);
  if (cur && !s.queue[s.i]) s.revealed = false;
  if (s.i >= s.queue.length) return;
  if (saved.parked) { parked = s; render(); }
  else { session = s; openSheet(); }
}
function resumeSession() { if (parked) { session = parked; parked = null; openSheet(); } }
function openSheet() { if (parked !== session) parked = null; session.shownAt = Date.now();
  if (session.kind === 'mock') {
    if (session.pausedAt) { const away = Date.now() - session.pausedAt; for (const k of Object.keys(session.secEnds)) session.secEnds[k] += away; delete session.pausedAt; }
    mockClock();
  } $('sheet').hidden = false; $('answer-bar').hidden = false; document.body.style.overflow = 'hidden'; renderSession(); }
function closeSheet() {
  try { speechSynthesis.cancel(); } catch (e) { /* no audio */ }
  // Stepping out mid-session parks it, so Today can pick it up exactly where you left off.
  if (session && session.kind === 'mock') { session.pausedAt = Date.now(); stopAudio(); }   // the clock stops while you're away
  parked = session && session.i < session.queue.length && session.kind !== 'sprint' ? session : null;
  session = null; saveSession(); $('sheet').hidden = true; $('answer-bar').hidden = true; document.body.style.overflow = '';
  render();
}
function insertLater(item, gap) {
  const pos = Math.min(session.queue.length, session.i + 1 + gap);
  session.queue.splice(pos, 0, item);
}

function sheetFrame(tags, inner) {
  const pct = session.i / session.queue.length * 100;
  return `<div class="sheet-inner">
    <div class="sheet-top">
      <div class="row-wrap" style="gap:6px;flex-wrap:nowrap"><button class="small-btn" id="s-close" aria-label="Back to Today; you can resume from this card">‹ Today</button>
      ${(session.history || []).length ? `<button class="icon-btn" id="s-prev" aria-label="See previous card">↶</button>` : ''}</div>
      <div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <span class="num muted" style="font-size:13px">${session.queue.length - session.i}</span>
    </div>
    <div class="card" id="s-card">
      <div class="card-front"><div class="tag-row">${tags.join('')}</div>${inner.front}</div>
      ${inner.back || ''}
    </div>
  </div>`;
}
function gradeBar(it) {
  if (it.hinted) return continueBar(it);
  const c = appData.cards[keyOf(it.type, it.x)];
  const preview = g => !c ? (g === 1 ? 'today' : g < 4 ? 'tomorrow' : Math.min(maxInterval(), FSRS.interval(FSRS.initS(g), retention())) + 'd') : '';
  return `<div class="row">
    <button class="ans again" data-g="1">Again<small>${it.again ? 'still no' : 'forgot'}</small></button>
    <button class="ans hard" data-g="2">Hard<small>${preview(2) || 'slow'}</small></button>
    <button class="ans good" data-g="3">Good<small>${preview(3) || 'got it'}</small></button>
    <button class="ans easy" data-g="4">Easy<small>${preview(4) || 'instant'}</small></button></div>`;
}
const learnBar = `<div class="row two"><button class="ans skip" id="a-known">Already know it</button><button class="ans next" id="a-learned">Got it, quiz me soon</button></div>`;

const ROUND = 50;
// A card that fails to draw is skipped rather than freezing the session (its progress is untouched),
// and the error is shown so it can be reported.
function renderSession() {
  for (let tries = 0; session && tries < 5; tries++) {
    try { return drawSession(); }
    catch (e) {
      showError(e);
      if (session.i >= session.queue.length) return closeSheet();
      session.queue.splice(session.i, 1); session.revealed = false;
    }
  }
}
function showError(e) {
  let box = $('err-note');
  if (!box) { box = document.createElement('div'); box.id = 'err-note'; box.className = 'err-note'; document.body.appendChild(box); }
  box.textContent = 'Something went wrong (' + ((e && e.message) || e) + '). Your progress is saved; please tell Claude this message.';
  box.hidden = false; clearTimeout(showError.t); showError.t = setTimeout(() => { box.hidden = true; }, 12000);
}
window.addEventListener('error', e => showError(e.error || e.message));
function drawSession() {
  if (!session) return;
  saveSession();
  if (session.i >= session.queue.length) return renderSessionEnd();
  if (session.paused) return renderRoundBreak();
  const it = session.queue[session.i];
  const tags = [];
  if (session.kind === 'study' && session.type === 'all' && TYPE_JP[it.type]) tags.push(`<span class="tag" lang="ja">${TYPE_JP[it.type]}</span>`);
  if (it.mode === 'learn' && !it.repair) tags.push('<span class="tag new">NEW</span>');
  if (it.again) tags.push('<span class="tag relearn">AGAIN</span>');
  let inner, bar;
  if (it.type === 'kanji') ({ inner, bar } = kanjiScreen(it, tags));
  else if (it.type === 'part') ({ inner, bar } = partScreen(it, tags));
  else if (it.type === 'vocab') ({ inner, bar } = vocabScreen(it, tags));
  else if (it.type === 'listen') ({ inner, bar } = listenScreen(it, tags));
  else if (it.type === 'exam') ({ inner, bar } = examScreen(it, tags));
  else if (it.type === 'mock') ({ inner, bar } = mockScreen(it, tags));
  else ({ inner, bar } = grammarScreen(it, tags));
  if (it.repair && it.mode === 'learn') {
    tags.push('<span class="tag relearn">REPAIR</span>');
    bar = '<div class="row one"><button class="ans next" id="a-repair">Read the story again · got it</button></div>';
  }
  if (it.practiceOnly) tags.push('<span class="tag">CHECK · SCHEDULE UNCHANGED</span>');
  // Leech: a card missed 4+ times needs a better hook, not more repetition.
  const lc = it.type !== 'listen' && it.type !== 'exam' && it.type !== 'mock' && it.mode !== 'look' && !it.sprint && appData.cards[keyOf(it.type, it.x)];
  if (lc && (lc.lapses || 0) >= 4) {
    tags.push('<span class="tag relearn">LEECH</span>');
    if (inner.back) inner.back = `<div class="notice">Missed ${lc.lapses} times. Repetition isn't working here: rewrite the story in your own words, make it stranger, or link it to something from your own life.</div>` + inner.back;
  }
  $('sheet').innerHTML = sheetFrame(tags, inner);
  $('sheet').scrollTop = 0;
  $('answer-bar').innerHTML = bar;
}

// ============ PART CARDS ============
function partBackHtml(p) {
  const img = p.image ? `<img class="card-img" src="${esc(p.image)}" data-kanji="${esc('c:' + p.kanji)}" alt="" loading="lazy" onerror="imgFallback(this)">` : '';
  const used = (p.usedIn || []).map(k => BY_KANJI[k]).filter(Boolean);
  return `<div class="back" data-in="${esc(p.kanji)}">
    <div class="headline"><div class="k-small" lang="ja">${esc(p.kanji)}</div>
      <div><div class="keyword">${esc(p.keyword)}</div><div class="meaning">a part, not a kanji you're tested on</div>
        ${(p.components || []).length ? `<div class="chips" style="margin-top:6px">${p.components.map(c => `<button class="chip" data-part="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}</div></div>
    ${img}<div class="story">${storyHtml(p.story || '')}</div>
    ${used.length ? `<div><div class="section-label">You'll find it in</div><div class="chips">${used.map(k => `<button class="chip" data-kt="${esc(k.kanji)}"><span lang="ja">${esc(k.kanji)}</span> ${esc(k.keyword)}</button>`).join('')}</div></div>` : ''}
  </div>`;
}
function partScreen(it, tags) {
  const p = it.x;
  tags.push('<span class="tag">部品 · PART</span>');
  const showBack = it.mode === 'learn' || session.revealed;
  const front = showBack ? '' : `<div class="cell"><span class="k" lang="ja">${esc(p.kanji)}</span></div><div class="prompt">Say this part's name and picture its story, then tap to check.</div>`;
  const prompt = it.mode === 'learn' ? `<div class="prompt">New part: it's inside ${(p.usedIn || []).slice(0, 3).join('、')}. Learn it first and those kanji become easy.</div>` : '';
  return { inner: { front: front + prompt, back: showBack ? partBackHtml(p) : '' },
    bar: it.mode === 'learn' ? learnBar : session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>` };
}
function kanjiScreen(it, tags) {
  const k = it.x;
  if (it.mode === 'look') {
    const g = groupById(it.group);
    tags.push('<span class="tag" lang="ja">似ている · LOOK-ALIKES</span>');
    return { inner: { front: '<div class="prompt">You now know kanji that look alike. The coloured strokes are what tells them apart.</div>', back: g ? `<div class="back">${lookGroupHtml(g, null, true)}</div>` : '' },
      bar: '<div class="row one"><button class="ans next" id="a-look">Got it</button></div>' };
  }
  if (it.task === 'which') {
    tags.push(`<span class="tag" lang="ja">似た漢字 · ${it.drill ? 'MIX-UP DRILL' : it.lookCheck ? 'QUICK CHECK' : it.pairCard ? 'LOOK-ALIKE PAIR' : it.sprint ? 'SPRINT' : 'WHICH ONE?'}</span>`);
    const top = it.sprint ? `<div class="sprint-bar"><span id="sprint-time" class="num">${Math.max(0, Math.ceil((session.ends - Date.now()) / 1000))}s</span><span class="num">Score ${session.score}</span></div>` : '';
    const front = `${top}<div class="keyword" style="text-align:center">${esc(k.keyword)}</div>
      ${it.hintWord ? `<div class="prompt" lang="ja">${esc(it.hintWord[0])}（${esc(it.hintWord[1])}）</div>` : ''}
      ${mcOptions(it, false, true)}${session.revealed ? whichNotes(it) : ''}`;
    return { inner: { front, back: session.revealed && !it.sprint && !it.drill && !it.lookCheck ? backHtml(k, 'quiz') : '' },
      bar: session.revealed ? (it.sprint ? '' : continueBar(it)) : pickHint(it.drill ? 'You mixed these up recently: which one is it?' : 'Pick the kanji with this meaning') };
  }
  if (it.mode === 'triage') tags.push(`<span class="tag">N${k.level} · DO YOU KNOW IT?</span>`);
  else tags.push(`<span class="tag">N${k.level}</span>`);
  const showBack = it.mode === 'learn' || session.revealed;
  const word = it.mode === 'quiz' ? it.word : null;
  const prompt = it.mode === 'triage' ? 'Know its meaning and at least one common reading?'
    : it.mode === 'learn' ? 'New kanji: read the story, say the words out loud.' : 'Say a reading and the meaning, then tap to check.';
  if (it.task === 'readmc') {
    tags.push('<span class="tag">漢字読み · PICK THE READING</span>');
    const front = `<div class="word-front" lang="ja">${kanjiTapHtml(word.w)}</div>${mcOptions(it, true)}`;
    return { inner: { front, back: session.revealed ? backHtml(k, 'quiz') : '' },
      bar: session.revealed ? continueBar(it) : pickHint('Watch for long vowels, small っ and ゛') };
  }
  const front = showBack && it.mode !== 'triage' ? (word ? `<div class="word-front revealed" lang="ja">${esc(word.w)}<span>${esc(word.r)}</span></div>` : '')
    : word ? `<div class="word-front" lang="ja">${kanjiTapHtml(word.w)}</div><div class="prompt">Read this word aloud (exam style), then tap to check. Tap a kanji for a hint.</div>`
    : `<div class="cell"><span class="k" lang="ja">${esc(k.kanji)}</span></div><div class="prompt">${prompt}</div>`;
  const back = showBack ? backHtml(k, it.mode === 'learn' ? 'learn' : 'quiz') : '';
  let bar;
  if (it.mode === 'learn') bar = learnBar;
  else if (it.mode === 'triage') {
    const btns = [session.undo.length ? `<button class="ans skip" id="t-undo">Undo</button>` : '',
      session.revealed ? '' : `<button class="ans skip" id="t-peek">Peek</button>`,
      `<button class="ans again" id="t-no">Not yet</button>`, `<button class="ans good" id="t-yes">Know it</button>`].filter(Boolean);
    bar = `<div class="row" style="grid-template-columns:repeat(${btns.length}, 1fr)">${btns.join('')}</div>`;
  } else bar = session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>`;
  return { inner: { front, back }, bar };
}

function mcOptions(it, kana, kanji, q) {
  const answered = session.revealed;
  return `<div class="opts${kana ? ' kana-opts' : ''}${kanji ? ' kanji-opts' : ''}">${it.opts.map((o, i) => {
    const cls = !answered ? '' : o === it.answerText ? ' right' : i === it.chosen ? ' wrong' : ' dim';
    // Word questions: an option with a kanji you haven't studied yet shows its reading.
    const rd = q && unstudied(o) && optReading(o, (q.w || [])[i]);
    return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${rd ? `<span class="opt-w">${esc(o)}<small>${esc(rd)}</small></span>` : esc(o)}</button>`;
  }).join('')}</div>`;
}
function continueBar(it) {
  return `<div class="row one"><button class="ans ${it.correct ? 'good' : 'again'}" id="a-continue">${it.correct ? 'Correct · continue' : it.hinted ? 'Hint used · it will come back' : 'Missed · it will come back'}</button></div>`;
}
// "Pick the spelling": after answering, what each wrong option is. The kanji it swaps in (with keywords),
// and when it's a real word, which word it is: the homophones the exam uses as traps.
function spellNotes(it) {
  const v = it.x, kw = ch => BY_KANJI[ch] ? `${ch} (${BY_KANJI[ch].keyword})` : ch;
  const rows = it.opts.map((o, i) => [o, i]).filter(([o]) => o !== v.w).sort(([, a], [, b]) => (b === it.chosen) - (a === it.chosen)).map(([o, i]) => {
    const swaps = [];
    if (o.length === v.w.length) for (let j = 0; j < o.length; j++) { if (o[j] !== v.w[j]) swaps.push(`${kw(o[j])} instead of ${kw(v.w[j])}`); }
    else swaps.push(`kanji ${[...o].filter(c => !v.w.includes(c)).map(kw).join(', ')}`);
    const other = BY_WORD[o] ? `${BY_WORD[o].r} · ${BY_WORD[o].m}` : (v.dx || {})[o];
    const what = other ? `A different word: ${other}.` : 'Not a real word.';
    return `<div class="${i === it.chosen ? 'picked' : ''}"><b lang="ja">${esc(o)}</b>${esc(what)} It uses <span lang="ja">${esc(swaps.join('; '))}</span>.</div>`;
  });
  return rows.length ? `<div class="wrongs">${rows.join('')}</div>` : '';
}
const pickHint = t => `<div class="row one"><span class="muted" style="text-align:center;font-size:13px">${t}</span></div>`;

// Kanji you haven't started yet (no card), including ones above N3.
const unstudied = o => [...o].some(c => c !== '々' && isKanji(c) && !appData.cards[c]);
// How an option is read: the deck word's reading, else built from its tap glosses (readings of each word in it).
function optReading(o, w) {
  const v = BY_WORD[w || o];
  if (v && v.w === o) return v.r;
  const gl = GL[o];
  if (!gl || !gl.length) return '';
  let out = '', pos = 0;
  for (const [st, len, r] of gl) { if (st < pos) continue; out += o.slice(pos, st) + r; pos = st + len; }
  out += o.slice(pos);
  return [...out].some(isKanji) ? '' : hira(out);
}
// Word questions: the sentence is tappable (reading and meaning of each word); the blank or underline stays.
const ctxHtml = s => glossHtml(s).replace('（　）', '<span class="blank">（　　）</span>');
const paraHtml = s => glossHtml(s).replace('【', '<u>').replace('】', '</u>');
// After answering: every option with its reading and meaning, the one you picked first. Options printed in kana
// (kanji above N3) show their written form too.
function optionNotes(q, chosen) {
  if (!q) return '';
  const rows = q.options.map((o, i) => {
    const v = BY_WORD[(q.w || [])[i] || o], cls = i === chosen && i !== q.answer ? 'picked' : '';
    if (v) {
      const head = o === v.w ? `${esc(v.w)} <span class="muted">${esc(v.r)}</span>` : `${esc(o)} <span class="muted">(written ${esc(v.w)})</span>`;
      return `<div class="${cls}"><b lang="ja">${head}</b> · ${esc(v.m)}</div>`;
    }
    // Not a deck word (a conjugated form like 続けて, or a phrase): its words' readings and meanings.
    const gl = GL[o] || [];
    if (!gl.length) return '';
    const rd = optReading(o);
    const parts = gl.map(([st, len, r, lemma, lr, m]) => `${gl.length > 1 ? `<span lang="ja">${esc(o.slice(st, st + len))}</span>: ` : ''}${esc(m || '')}${lemma !== o.slice(st, st + len) ? ` <span lang="ja">(${esc(lemma)})</span>` : ''}`);
    return `<div class="${cls}"><b lang="ja">${esc(o)}${rd && rd !== o ? ` <span class="muted">${esc(rd)}</span>` : ''}</b> · ${parts.join('; ')}</div>`;
  }).filter(Boolean);
  return rows.length ? `<div class="wrongs">${rows.join('')}</div>` : '';
}

function vocabScreen(it, tags) {
  const v = it.x;
  tags.push('<span class="tag">WORD</span>');
  if (['ctx', 'para', 'usage'].includes(it.task)) {
    const q = it.q, answered = session.revealed;
    tags.push(`<span class="tag" lang="ja">${{ ctx: '文脈規定 · WHICH WORD FITS?', para: '言い換え · CLOSEST MEANING', usage: '用法 · WHICH IS USED RIGHT?' }[it.task]}</span>`);
    const prompt = it.task === 'ctx' ? `<div class="g-q" lang="ja">${ctxHtml(q.s)}</div>`
      : it.task === 'para' ? `<div class="g-q" lang="ja">${paraHtml(q.s)}</div><div class="prompt">Which is closest in meaning to the underlined part?</div>`
      : `<div class="word-front" lang="ja">${esc(vform(v) === 'kanji' ? v.w : v.r)}</div><div class="prompt">Which sentence uses this word correctly?</div>`;
    const front = `${prompt}${it.task === 'usage' ? `<div class="opts g long">${q.options.map((o, i) => {
        const cls = !answered ? '' : i === q.answer ? ' right' : i === it.chosen ? ' wrong' : ' dim';
        return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${esc(o)}</button>`; }).join('')}</div>` : mcOptions(it, false, false, q)}
      ${answered && q.why ? `<div class="why">${esc(q.why)}</div>` : ''}${answered && q.en ? `<div class="tr"><span class="muted">EN</span> ${esc(q.en)}</div>` : ''}
      ${answered ? optionNotes(it.task === 'usage' ? null : q, it.chosen) : ''}`;
    return { inner: { front, back: answered ? vocabBackHtml(v) : '' }, bar: answered ? continueBar(it) : pickHint('Choose one') };
  }
  if (it.mode === 'learn') {
    return { inner: { front: '', back: vocabBackHtml(v, 'learn') }, bar: learnBar };
  }
  if (it.task === 'spell') {
    tags.push('<span class="tag">表記 · PICK THE KANJI</span>');
    const front = `<div class="word-front kana" lang="ja" style="${kanaSize(v.r)}">${esc(v.r)}</div><div class="prompt">${esc(v.m)}</div>${mcOptions(it)}${session.revealed ? spellNotes(it) : ''}`;
    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },
      bar: session.revealed ? continueBar(it) : pickHint('Choose the correct spelling') };
  }
  if (it.task === 'readmc') {
    tags.push('<span class="tag">漢字読み · PICK THE READING</span>');
    if (session.revealed) speak(sayText(v.w, v.r));
    const front = `<div class="word-front" lang="ja">${kanjiTapHtml(v.w)}</div>${mcOptions(it, true)}`;
    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },
      bar: session.revealed ? continueBar(it) : pickHint('Watch for long vowels, small っ and ゛') };
  }
  if (it.task === 'meaning') {
    tags.push('<span class="tag">意味 · WHAT DOES IT MEAN?</span>');
    if (session.revealed) speak(sayText(v.w, v.r));
    const front = session.revealed ? '' : `<div class="word-front kana" lang="ja" style="${kanaSize(v.r)}">${esc(v.r)}</div><div class="prompt">Say what it means, then tap to check. ${sayBtn(sayText(v.w, v.r), 'Play ' + v.r)}</div>`;
    return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },
      bar: session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>` };
  }
  tags.push('<span class="tag">漢字読み · READ IT</span>');
  const front = session.revealed ? '' : `<div class="word-front" lang="ja">${kanjiTapHtml(v.w)}</div><div class="prompt">Say the reading and meaning, then tap to check. Tap a kanji for a hint.</div>`;
  if (session.revealed) speak(sayText(v.w, v.r));
  return { inner: { front, back: session.revealed ? vocabBackHtml(v) : '' },
    bar: session.revealed ? gradeBar(it) : `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>` };
}

// Ordering task: readings and meanings of the words in a chunk, shown only when asked for.
function chunkGl(o, i) {
  const words = (o.cgl || [])[i] || [];
  return words.length ? `<span class="cgl">${words.map(([w, r, m]) => `${esc(w)}${r && r !== w ? ` <b>${esc(r)}</b>` : ''} · ${esc(m)}`).join('<br>')}</span>` : '';
}
// After answering: why each wrong option doesn't fit, the one you picked first.
function wrongsHtml(f, chosen) {
  const w = f.wrong || {};
  const idx = f.choices.map((_, i) => i).filter(i => i !== f.answer && w[f.choices[i]])
    .sort((a, b) => (b === chosen) - (a === chosen));
  return idx.length ? `<div class="wrongs">${idx.map(i => `<div class="${i === chosen ? 'picked' : ''}"><b lang="ja">${esc(f.choices[i])}</b>${esc(w[f.choices[i]])}</div>`).join('')}</div>` : '';
}
// After an ordering task: each part in the right order, with the readings and meanings of its words.
function partsHtml(o) {
  const rows = o.chunks.map((c, i) => [c, chunkGl(o, i)]).filter(([, gl]) => gl);
  return rows.length ? `<div class="parts-gl">${rows.map(([c, gl]) => `<div><b lang="ja">${esc(c)}</b><span lang="ja">${gl}</span></div>`).join('')}</div>` : '';
}
// The question's English: behind a button until you answer, then shown.
function trHtml(it, en, answered) {
  if (!en) return '';
  return `<div class="tr">${answered || it.showTr ? `<span class="muted">EN</span> ${esc(en)}` : '<button class="small-btn" id="g-tr">Show translation</button>'}</div>`;
}
function grammarScreen(it, tags) {
  const g = it.x;
  tags.push('<span class="tag">GRAMMAR</span>');
  if (it.mode === 'learn') return { inner: { front: '', back: grammarBackHtml(g) }, bar: learnBar };
  const answered = session.revealed;
  const cont = `<div class="row one"><button class="ans ${it.correct ? 'good' : 'again'}" id="a-continue">${it.correct ? 'Correct · continue' : 'Missed · it will come back'}</button></div>`;
  if (it.task === 'fill') {
    tags.push('<span class="tag">文法 · FILL THE BLANK</span>');
    const f = it.f;
    const q = glossHtml(f.q).replace('（　）', `<span class="blank">${answered ? esc(f.choices[f.answer]) : '（　　）'}</span>`);
    const front = `<div class="g-q" lang="ja">${q}</div>
      <div class="opts g${f.choices.some(c => c.length > 4) ? ' long' : ''}">${f.choices.map((o, i) => {
        const cls = !answered ? '' : i === f.answer ? ' right' : i === it.chosen ? ' wrong' : ' dim';
        return `<button class="opt${cls}" data-opt="${i}" ${answered ? 'disabled' : ''} lang="ja"><span class="num">${i + 1}</span>${esc(o)}</button>`;
      }).join('')}</div>
      ${trHtml(it, f.en, answered)}
      ${answered ? `<div class="why">${esc(f.why)} ${sayBtn(f.q.replace('（　）', f.choices[f.answer]))}</div>` : ''}
      ${answered ? wrongsHtml(f, it.chosen) : ''}`;
    return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' },
      bar: answered ? cont : `<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Choose what fits （　）</span></div>` };
  }
  // ★ ordering
  tags.push('<span class="tag">並べ替え · ORDER THE PARTS</span>');
  const o = g.order, st = it.order;
  const slots = [0, 1, 2, 3].map(i => {
    const p = st.picked[i];
    const star = i === o.star ? '<span class="star">★</span>' : '';
    const correctChunk = answered ? o.chunks[i] : null;
    return `<button class="slot${p ? ' filled' : ''}${answered ? (st.picked[i] && st.picked[i].i === i ? ' right' : ' wrong') : ''}" data-slot="${i}" ${answered ? 'disabled' : ''} lang="ja">${star}${answered ? esc(correctChunk) : p ? esc(p.c) : '＿＿'}</button>`;
  }).join('');
  const front = `<div class="g-q order" lang="ja"><span>${glossHtml(o.before)}</span>${slots}<span>${glossHtml(o.after)}</span></div>
    ${answered ? '' : trHtml(it, o.en, false)}
    ${answered ? `<div class="why">${esc(o.en)} ${sayBtn(o.before + o.chunks.join('') + o.after)}</div>${partsHtml(o)}` :
      `<div class="opts chunks">${st.pool.map((p, j) => `<button class="opt${it.showGl ? ' with-gl' : ''}" data-chunk="${j}" lang="ja">${esc(p.c)}${it.showGl ? chunkGl(o, p.i) : ''}</button>`).join('')}</div>
       <div class="prompt">Tap the parts in order. Tap a filled slot to take it back.</div>
       ${(o.cgl || []).some(x => x.length) && !it.showGl ? '<div class="tr"><button class="small-btn" id="g-cgl">Show readings &amp; meanings</button></div>' : ''}`}`;
  return { inner: { front, back: answered ? grammarBackHtml(g, true) : '' }, bar: answered ? cont : '<div class="row one"><span class="muted" style="text-align:center;font-size:13px">Fill all four slots</span></div>' };
}

function answerChoice(i) {
  const it = session.queue[session.i];
  if (session.revealed) return;
  it.chosen = i;
  it.correct = !it.hinted && (it.answerText != null ? it.opts[i] === it.answerText : i === it.f.answer);
  if (it.task === 'which' && !it.correct) { noteConfusion(it.answerText, it.opts[i]); saveData(); }
  session.revealed = true;
  if (it.sprint) {
    if (it.correct) session.score++;
    renderSession();
    // A right answer moves on at once; a wrong one stays a moment so you can see the difference.
    setTimeout(() => { if (session && session.queue[session.i] === it) { session.i++; session.revealed = false; renderSession(); } }, it.correct ? 300 : 1600);
    return;
  }
  renderSession();
}
function pickChunk(j) {
  const it = session.queue[session.i], st = it.order;
  const p = st.pool.splice(j, 1)[0];
  const slot = [0, 1, 2, 3].find(i => !st.picked[i]);
  st.picked[slot] = p;
  if (st.picked.filter(Boolean).length === 4) {
    it.correct = st.picked.every((x, i) => x.i === i);
    session.revealed = true;
  }
  renderSession();
}
function unpickSlot(i) {
  const it = session.queue[session.i], st = it.order;
  if (!st.picked[i]) return;
  st.pool.push(st.picked[i]); st.picked[i] = undefined;
  renderSession();
}

function renderRoundBreak() {
  const left = session.queue.length - session.i;
  $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">休</span></div>
    <h2 style="margin-top:14px">Round done: ${session.done} answered</h2>
    <p class="muted">${left} more in this session, about ${Math.max(1, Math.round(left * timing().review / 60))} min. Stopping here is fine: they'll be waiting, most urgent first.</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row two"><button class="ans skip" id="s-finish">Stop for now</button><button class="ans next" id="r-more">Keep going</button></div>`;
}
function remainingToday() {
  return TYPES.map(t => ({ t, n: dueOf(t).length + newQueueOf(t).length })).filter(x => x.n);
}
function renderSessionEnd() {
  const triage = session.kind === 'triage';
  if (session.kind === 'mock') {
    clearInterval(startMock.timer);
    $('sheet').innerHTML = mockEndHtml();
    $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
    return;
  }
  if (session.kind === 'sprint') {
    const best = appData.sprintBest || 0, isBest = session.score > best;
    if (isBest) { appData.sprintBest = session.score; saveData(); }
    $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
      <div class="cell" style="margin:0 auto"><span class="k" lang="ja">似</span></div>
      <h2 style="margin-top:14px">${session.score} right in 60 seconds</h2>
      <p class="muted">${isBest ? 'A new best!' : `Your best: ${best}.`} Pairs you mixed up come back tomorrow as a short drill.</p></div></div>`;
    $('answer-bar').innerHTML = `<div class="row two"><button class="ans skip" id="s-finish">Back to today</button><button class="ans next" id="go-sprint">Again</button></div>`;
    return;
  }
  if (session.kind === 'listen') {
    $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
      <div class="cell" style="margin:0 auto"><span class="k" lang="ja">聴</span></div>
      <h2 style="margin-top:14px">${session.heard} of ${session.queue.length} understood</h2>
      <p class="muted">Anything you missed by ear but know on paper is a listening gap. Replay those words out loud a few times.</p></div></div>`;
    $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
    return;
  }
  $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">${triage ? '済' : '終'}</span></div>
    <h2 style="margin-top:14px">${triage ? 'Triage done' : 'Session done'}</h2>
    <p class="muted">${triage ? `Unseen kanji left to learn: ${unseen().length}. The daily plan now uses that number.`
      : `${session.done} cards answered. ${remainingToday().length ? 'Still to do today: ' + remainingToday().map(x => `${TYPE_LABEL[x.t]} ${x.n}`).join(' · ') + '.' : "That's everything for today."}`}</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
}

function grade(g) {
  const it = session.queue[session.i];
  if (it.drill) { drillResult(it); saveData(); session.done++; return next(); }   // practice: no card is rescheduled
  if (it.lookCheck) { session.done++; return next(); }   // the quick check after a look-alike lesson: practice only
  if (it.practiceOnly) {   // a repair check: practice only, so an early "Good" doesn't push the card's review away
    session.done++;
    if (g === 1) insertLater(Object.assign(quizItem(it.type, it.x), { practiceOnly: true, again: true }), 4);
    return next();
  }
  if (it.pairCard) {   // a look-alike pair card: its own schedule, not the kanji's
    if (!it.again) { schedule(it.pairCard, g); logReview(g > 1); }
    session.done++;
    if (g === 1) { const again = pairItem(it.pairCard.slice(2), { again: true }); if (again) insertLater(again, 4); }
    saveData();
    return next();
  }
  noteTime('review', session.shownAt);
  if (!it.again) {
    // First answer for this card in this session counts for scheduling.
    schedule(keyOf(it.type, it.x), g);
    logReview(g > 1);
  }
  session.done++;
  if (g === 1) insertLater(Object.assign(quizItem(it.type, it.x), { again: true }), 4);
  saveData();
  next();
}
function next() {
  stopAudio();
  const it = session.queue[session.i];
  if (it && it.mode !== 'triage') (session.history = session.history || []).push(it);
  session.i++; session.revealed = false; session.shownAt = Date.now();
  // Long sessions come in rounds of 50: a natural place to stop, or a nudge to keep going.
  if (session.kind === 'study' && session.done && session.done % ROUND === 0 && session.done !== session.lastPause && session.i < session.queue.length) {
    session.lastPause = session.done; session.paused = true;
  }
  renderSession();
}
// Look back at cards already done this session (‹ button or swipe right). Read-only: nothing is re-graded.
function backFor(it) {
  if (it.type === 'kanji') return backHtml(it.x, 'learn');
  if (it.type === 'part') return partBackHtml(it.x);
  if (it.type === 'vocab') return vocabBackHtml(it.x);
  if (it.type === 'grammar') return grammarBackHtml(it.x);
  if (it.type === 'exam') return `<div class="passage" lang="ja">${esc(it.x.text || it.x.line || (it.x.turns || []).map(t => t.t).join(' / '))}</div>`;
  return `<div class="listen-text${it.x.sentence ? ' sentence' : ''}" lang="ja">${it.x.sentence ? glossHtml(it.x.show) : esc(it.x.show)}</div><div class="keyword" style="font-size:17px">${esc(it.x.meaning)}</div>`;
}
function showHistory(idx) {
  const h = session.history || [];
  if (!h.length) return;
  idx = Math.max(0, Math.min(h.length - 1, idx));
  $('modal-body').innerHTML = `<div class="stack">
    <div class="row-wrap" style="justify-content:space-between">
      <div class="row-wrap" style="gap:6px"><button class="icon-btn" data-hist="${idx - 1}" ${idx === 0 ? 'disabled' : ''} aria-label="Earlier card">‹</button>
      <button class="icon-btn" data-hist="${idx + 1}" ${idx === h.length - 1 ? 'disabled' : ''} aria-label="Later card">›</button>
      <span class="eyebrow">${h.length - idx} back</span></div>
      <button class="icon-btn" id="modal-close" aria-label="Back to the current card">✕</button></div>
    <div class="card">${backFor(h[idx])}</div></div>`;
  $('modal').hidden = false;
  $('modal').dataset.hist = idx;
}

function triageAnswer(known) {
  const it = session.queue[session.i];
  const k = it.x.kanji;
  session.undo.push({ k, prevCard: appData.cards[k], prevTri: appData.triaged[k] });
  appData.triaged[k] = known ? 'known' : 'unknown';
  if (known) markKnown(k);
  saveData();
  session.done++;
  next();
}
function triageUndo() {
  const u = session.undo.pop(); if (!u) return;
  if (u.prevCard) appData.cards[u.k] = u.prevCard; else delete appData.cards[u.k];
  if (u.prevTri) appData.triaged[u.k] = u.prevTri; else delete appData.triaged[u.k];
  saveData();
  session.i = Math.max(0, session.i - 1); session.revealed = false; session.done--;
  renderSession();
}

// ============ EVENTS ============
document.addEventListener('click', e => {
  if (!e.target.closest('[data-gl], [data-kt], [data-part], #gl-pop')) $('gl-pop').hidden = true;
  const t = e.target.closest('button, [data-k]');
  if (!t) { if (e.target === $('modal')) $('modal').hidden = true; return; }
  if (t.dataset.say !== undefined) { e.stopPropagation(); return speak(t.dataset.say); }
  if (t.dataset.gl) { e.stopPropagation(); return showGloss(t); }
  if (t.dataset.kt && t.closest('.sheet')) { e.stopPropagation(); return showKanjiPop(t); }
  if (t.dataset.part) { e.stopPropagation(); return showPart(t); }
  if (t.dataset.openK) { $('gl-pop').hidden = true; return showDetail(t.dataset.openK); }
  if (t.dataset.hist !== undefined) return showHistory(+t.dataset.hist);
  if (t.id === 's-prev') return showHistory((session.history || []).length - 1);
  const id = t.id;
  if (t.closest('#tabs')) { view = t.dataset.view; confirmingReset = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.k && !t.closest('.sheet')) return showDetail(t.dataset.k);
  if (t.dataset.k && t.closest('.sheet')) return;
  if (t.dataset.v) { const v = BY_WORD[t.dataset.v]; if (v) showModal('v:' + v.w, vocabBackHtml(v)); return; }
  if (t.dataset.gId) { const g = BY_GID[t.dataset.gId]; if (g) showModal('g:' + g.id, grammarBackHtml(g)); return; }
  if (t.dataset.dtype) { deckFilter.type = t.dataset.dtype; deckFilter.q = ''; render(); return; }
  if (t.dataset.lv !== undefined) { deckFilter.level = +t.dataset.lv; render(); return; }
  if (t.dataset.snap !== undefined) { const x = snapshots()[+t.dataset.snap]; if (x) restore(JSON.stringify(x.data)); return; }
  if (t.dataset.study) return startStudy(t.dataset.study);
  if (t.id === 'go-extra') { const mix = extraMix(); if (mix.length) runQueue([], mix, 'all'); return; }
  if (t.dataset.g) return grade(+t.dataset.g);
  if (t.dataset.opt !== undefined) return answerChoice(+t.dataset.opt);
  if (t.dataset.chunk !== undefined) return pickChunk(+t.dataset.chunk);
  if (t.dataset.play) { e.stopPropagation(); return playExam(t.dataset.play); }
  if (t.dataset.mplay) { e.stopPropagation(); (session.played = session.played || {})[session.i] = true; playExam(t.dataset.mplay); return renderSession(); }
  if (t.dataset.mopt !== undefined) return mockAnswer(+t.dataset.mopt);
  if (t.dataset.eopt) { const [qi, oi] = t.dataset.eopt.split(':').map(Number); return answerExam(qi, oi); }
  if (t.dataset.slot !== undefined) return unpickSlot(+t.dataset.slot);
  switch (id) {
    case 'go-triage': return startTriage();
    case 'go-all': {
      if (dueOf('vocab').length + dueOf('kanji').length + dueOf('grammar').length + newQueueOf('kanji').length + newQueueOf('vocab').length + newQueueOf('grammar').length
        + practiceItems().length + duePairItems().length + drillItems().length + pendingLookLessons().length + dueOf('part').length + pendingParts().length) return startStudy('all');
      const b = bonusPick(); if (b) b.run(); return;   // plan done: catch up, or the best use of spare minutes
    }
    case 'a-repair': {
      const it = session.queue[session.i];
      appData.repaired[keyOf(it.type, it.x)] = today(); saveData();
      return next();
    }
    case 'go-reviews': return runQueue([...interleave(TYPES.map(t => dueOf(t).map(x => quizItem(t, x))).concat([duePartItems()])), ...duePairItems(), ...drillItems()], pendingLookLessons(), 'all');
    case 'go-weak': return startWeak();
    case 'go-listen': return startListen();
    case 'l-yes': session.heard++; session.done++; return next();
    case 'l-no': session.done++; return next();
    case 'quick-backup': return quickBackup();
    case 'hide-home-tip': appData.hideHomeTip = true; saveData(); return render();
    case 's-close': case 's-finish': return closeSheet();
    case 'go-resume': return resumeSession();
    case 'a-reveal': session.revealed = true; return renderSession();
    case 'r-more': session.paused = false; return renderSession();
    case 'g-tr': session.queue[session.i].showTr = true; return renderSession();
    case 'g-cgl': session.queue[session.i].showGl = true; return renderSession();
    case 'a-continue': { const it = session.queue[session.i]; return grade(it.correct ? 3 : 1); }
    case 'a-look': {
      const it = session.queue[session.i], g = groupById(it.group);
      appData.lookSeen[it.group] = today(); saveData();
      // Straight after the lesson: up to three quick "which one?" questions on this group (practice, not scheduled).
      if (g) shuffle(g.kanji.slice()).slice(0, 3).forEach((c, n) => {
        const q = whichItem(BY_KANJI[c], { lookCheck: true }); q.opts = shuffle(g.kanji.slice(0, 4).includes(c) ? g.kanji.slice(0, 4) : [c, ...g.kanji.filter(x => x !== c).slice(0, 3)]);
        session.queue.splice(session.i + 1 + n, 0, q);
      });
      return next();
    }
    case 'go-sprint': return startSprint();
    case 'e-next': session.done++; return next();
    case 'm-next': return mockStep(1);
    case 'm-back': return mockStep(-1);
    case 'go-mock': return startMock(t.dataset.set);
    case 'go-practice': { const ps = practiceItems(); return ps.length ? runQueue(ps, [], 'all') : runQueue(practiceItems(true), [], 'all'); }
    case 'mock-save': return saveMock();
    case 'a-learned': {
      const it = session.queue[session.i];
      // Learning the second kanji of a look-alike group: the side-by-side lesson comes right after.
      if (it.type === 'kanji') for (const g of groupsOf(it.x.kanji))
        if (!appData.lookSeen[g.id] && g.kanji.filter(c => c === it.x.kanji || started(c)).length >= 2 && !session.queue.some(q => q.group === g.id))
          session.queue.splice(session.i + 1, 0, { type: 'kanji', x: it.x, mode: 'look', group: g.id });
      noteTime('learn', session.shownAt);
      // Extras are on top of today's plan, so they don't use up its new cards (tomorrow's plan counts them).
      const dk = it.extra ? today() + '|extra' : dayKey(it.type);
      appData.newByDay[dk] = (appData.newByDay[dk] || 0) + 1;
      // Saved as learned straight away (due today), so closing the app before its quiz doesn't lose it.
      const key = keyOf(it.type, it.x);
      if (!appData.cards[key]) appData.cards[key] = { stability: 0, difficulty: 0, reps: 0, lapses: 0, lastReview: today(), due: today() };
      saveData();
      insertLater(quizItem(it.type, it.x), 3);
      return next();
    }
    case 'a-known': {
      const it = session.queue[session.i];
      markKnown(keyOf(it.type, it.x));
      saveData();
      return next();
    }
    case 't-yes': return triageAnswer(true);
    case 't-no': return triageAnswer(false);
    case 't-peek': session.revealed = true; return renderSession();
    case 't-undo': return triageUndo();
    case 'modal-close': $('modal').hidden = true; return;
    case 'b-copy': return copyBackup();
    case 'b-restore': return restore($('backup').value);
    case 'r-ask': confirmingReset = true; return render();
    case 'r-no': confirmingReset = false; return render();
    case 'r-yes': appData = emptyData(); appData.settingsAt = Date.now(); saveData(); confirmingReset = false; view = 'today'; return render();
    case 'dl-json': return downloadFile(`n3-progress-${today()}.json`, JSON.stringify(appData, null, 1));
    case 'dl-csv': return downloadFile(`n3-stats-${today()}.csv`, statsCsv());
    case 'dl-days': return downloadFile(`n3-daily-${today()}.csv`, dailyCsv());
  }
});
// Swipe right during a session to look at the previous card.
let touch0 = null;
document.addEventListener('touchstart', e => { if (session && e.touches.length === 1) touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0 || !session) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  touch0 = null;
  if (dx > 80 && Math.abs(dy) < 50) {
    if ($('modal').hidden) showHistory((session.history || []).length - 1);
    else showHistory(+($('modal').dataset.hist || 0) - 1);
  } else if (dx < -80 && Math.abs(dy) < 50 && !$('modal').hidden) {
    const i = +($('modal').dataset.hist || 0);
    if (i >= (session.history || []).length - 1) $('modal').hidden = true; else showHistory(i + 1);
  }
}, { passive: true });
document.addEventListener('input', e => {
  if (e.target.id === 'deck-search') { deckFilter.q = e.target.value; renderDeckGrid(); }
});
document.addEventListener('change', e => {
  const st = appData.settings;

  if (e.target.id === 'set-vocab') { const v = e.target.value.trim(); st.vocabPerDay = v === '' ? 'auto' : num(v); saveData(); render(); }

document.addEventListener('keydown', e => {
  if (!session || e.target.matches('input, textarea')) return;
  if (session.paused) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); session.paused = false; renderSession(); } return; }
  const it = session.queue[session.i];
  if (!it) { if (e.key === 'Enter' || e.key === ' ') closeSheet(); return; }
  if (e.key === 'Escape') return closeSheet();
  const choice = it.mode === 'quiz' && ['spell', 'fill', 'readmc', 'which', 'ctx', 'para', 'usage'].includes(it.task);
  if (it.mode === 'listen') { if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; renderSession(); } else if (session.revealed && (e.key === '1' || e.key === '2')) $(e.key === '1' ? 'l-no' : 'l-yes').click(); return; }
  if (it.mode === 'learn' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ($('a-learned') || $('a-repair')).click(); }
  else if (it.mode === 'triage') { if (e.key === 'ArrowRight' || e.key === 'k') triageAnswer(true); if (e.key === 'ArrowLeft' || e.key === 'n') triageAnswer(false); }
  else if (choice && !session.revealed && '1234'.includes(e.key)) answerChoice(+e.key - 1);
  else if ((choice || it.task === 'order') && session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); grade(it.correct ? 3 : 1); }
  else if (!choice && it.task !== 'order' && !session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; renderSession(); }
  else if (!choice && it.task !== 'order' && session.revealed && '1234'.includes(e.key)) grade(+e.key);
});

// ============ DOWNLOADS ============
function csvCell(x) { const s = String(x == null ? '' : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function statsCsv() {
  const rows = [['deck', 'item', 'reading', 'meaning', 'status', 'memory_strength_days', 'difficulty', 'reviews', 'misses', 'last_review', 'next_review', 'recall_chance_now']];
  const add = (type, key, item, reading, meaning) => {
    const c = appData.cards[key];
    rows.push([TYPE_LABEL[type], item, reading, meaning, statusKey(key), c ? r3(c.stability) : '', c ? r3(c.difficulty) : '', c ? c.reps || 0 : 0,
      c ? c.lapses || 0 : 0, c ? c.lastReview || '' : '', c ? c.due || '' : '', c ? Math.round(recall(c) * 100) + '%' : '']);
  };
  for (const k of DECK) add('kanji', k.kanji, k.kanji, [...(k.on || []), ...(k.kun || [])].join(' / '), k.keyword);
  for (const v of VOCAB) add('vocab', 'v:' + v.w, v.w, v.r, v.m);
  for (const g of GRAMMAR) add('grammar', 'g:' + g.id, g.pattern, '', g.meaning);
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n');   // BOM so Excel reads the Japanese correctly
}
function dailyCsv() {
  const days = Object.keys(appData.history).sort();
  const rows = [['date', 'reviews', 'new_kanji', 'new_words', 'new_grammar']];
  for (const d of days) rows.push([d, appData.history[d] || 0, appData.newByDay[d] || 0, appData.newByDay[d + '|vocab'] || 0, appData.newByDay[d + '|grammar'] || 0]);
  return '\ufeff' + rows.map(r => r.join(',')).join('\n');
}
async function downloadFile(filename, text) {
  const msg = $('dl-msg');
  const say = t => { if (msg) msg.textContent = t; };
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); } say(`Saved ${filename}.`); }
    catch (e) { say(e && e.code === 'declined' ? 'Download cancelled.' : 'This view cannot save files. Use Copy backup instead.'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (filename.endsWith('.json')) { appData.lastBackup = today(); saveData(); }
    say(`Downloaded ${filename}.`);
  } catch (e) { say('This browser blocked the download. Use Copy backup instead.'); }
}

function quickBackup() {
  appData.lastBackup = today(); saveData();
  const txt = JSON.stringify(appData);
  const done = () => { render(); const n = $('backup-note'); if (n) n.textContent = 'Backup copied. Paste it into a note or an email to yourself.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { view = 'more'; render(); copyBackup(); });
  else { view = 'more'; render(); copyBackup(); }
}
function copyBackup() {
  appData.lastBackup = today(); saveData();
  const txt = JSON.stringify(appData);
  const ta = $('backup'); ta.value = txt;
  const msg = $('b-msg');
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = 'Backup is in the box above, selected. Copy it with your device\'s Copy command.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Backup copied. Paste it into a note or email to yourself.'; }, fallback);
  } else fallback();
}
function restore(txt) {
  const msg = $('b-msg');
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d.cards !== 'object') throw new Error('no cards');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    appData = loadData();
    appData.settingsAt = Date.now();
    scheduleSync();
    msg.textContent = `Restored ${Object.keys(appData.cards).length} cards.`;
  } catch (e) {
    msg.textContent = 'That text is not a backup from this app. Copy the whole backup, starting with { and ending with }.';
  }
}

// ============ BOOT ============
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
const getJson = (f, optional) => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); }).catch(err => { if (optional) return []; throw err; });
Promise.all([getJson('kanji.json'), getJson('vocab.json', true), getJson('grammar.json', true)]).then(([kd, vd, gd]) => {
  DECK = kd.cards;
  CAST = kd.cast || {};
  CAST_NOTE = kd.castNote || '';
  PARTS = kd.parts || {};
  BY_KANJI = Object.fromEntries(DECK.map(k => [k.kanji, k]));
  PART_DECK = (kd.partCards || []).map(p => Object.assign({ on: [], kun: [], vocab: [], part: true }, p));
  BY_PART = Object.fromEntries(PART_DECK.map(p => [p.kanji, p]));
  PARTS_OF = {};
  for (const p of PART_DECK) for (const k of p.usedIn || []) (PARTS_OF[k] = PARTS_OF[k] || []).push(p);
  VOCAB = vd; BY_WORD = Object.fromEntries(VOCAB.map(v => [v.w, v]));
  GRAMMAR = gd; BY_GID = Object.fromEntries(GRAMMAR.map(g => [g.id, g]));
  for (const g of GRAMMAR) Object.assign(GL, g.gl || {});
  render();
  restoreSession();
  initSync();
  getJson('speech/index.json', true).then(x => { if (x && !Array.isArray(x)) REC = x; });
  // Exam practice (listening, reading, extra word questions) loads in the background.
  getJson('exam.json', true).then(ex => {
    if (!ex || Array.isArray(ex)) return;
    EXAM = Object.assign({ qr: [], dlg: [], read: [], vocab: {} }, ex);
    for (const x of EXAM.read) for (const [ja, gl] of Object.entries(x.gl || {})) GL[ja] = gl;
    for (const x of [...EXAM.qr, ...EXAM.dlg, ...(EXAM.mock_items || []), ...(EXAM.mocks || []).flatMap(m => m.read)]) for (const [ja, gl] of Object.entries(x.gl || {})) GL[ja] = gl;
    for (const q of [...Object.values(EXAM.vocab), ...(EXAM.mocks || []).map(m => m.vocab)])
      for (const x of [...(q.ctx || []), ...[].concat(q.para || [], q.usage || [])]) Object.assign(GL, x.gl || {});
    planCache = null;
    if (!session) render();
  });
  // Look-alike groups and their stroke drawings load in the background too.
  getJson('lookalikes.json', true).then(gs => {
    if (!Array.isArray(gs) || !gs.length) return;
    // Only kanji in the deck; a group needs at least two of them.
    LOOK = gs.map(g => Object.assign(g, { kanji: g.kanji.filter(c => BY_KANJI[c]) })).filter(g => g.kanji.length >= 2); LOOK_BY = {};
    for (const g of gs) for (const c of g.kanji) (LOOK_BY[c] = LOOK_BY[c] || []).push(g);
    if (!session) render();
  });
  // Example sentences for words are large, so they load after the app is already usable.
  getJson('examples.json', true).then(ex => {
    if (!ex || Array.isArray(ex)) return;
    EXAMPLES = ex;
    for (const list of Object.values(ex)) for (const [ja, , gl] of list) if (gl && gl.length) GL[ja] = gl;
    // A word card already on screen (say, a review resumed after an update) gets its sentences now.
    const it = session && session.queue[session.i];
    if (it && it.type === 'vocab' && EXAMPLES[it.x.w]) { const y = $('sheet').scrollTop; renderSession(); $('sheet').scrollTop = y; }
  });
}).catch(() => {
  $('app').innerHTML = '<div class="loading">The deck file (kanji.json) did not load. If you opened this file directly from disk, serve the folder instead: python3 -m http.server</div>';
});
</script>
