<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>N3 Kanji Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one thumb-reach column, fixed bottom tabs; study runs as a full-screen sheet.
   Kanji are set in Mincho because that is the typeface the JLPT paper prints them in. */
:root {
  --paper: #eef1f6;
  --surface: #fbfcfe;
  --ink: #18202f;
  --muted: #5a6477;
  --line: #d3d9e4;
  --ai: #2b4a8b;          /* aizome indigo, the accent */
  --ai-soft: #dde5f3;
  --again: #c4471b;
  --hard: #a86f12;
  --good: #23784f;
  --easy: #2a68aa;
  --grid: #e3a49a;        /* genkō yōshi practice-grid red */
  --font-kanji: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
    --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
    --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1320; --surface: #161d2c; --ink: #e6eaf2; --muted: #9aa3b6; --line: #29324a;
  --ai: #93acea; --ai-soft: #1e2944; --again: #f08b5f; --hard: #e1b052; --good: #5fc496;
  --easy: #7fb5ef; --grid: #7a4842; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- bottom tabs ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs button { background: none; border: 0; padding: 10px 4px 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button .jp { font-family: var(--font-kanji); font-size: 20px; line-height: 1.1; font-weight: 800; }
.tabs button[aria-current="page"] { color: var(--ai); }

/* ---------- today ---------- */
.today-head { display: grid; gap: 4px; margin-bottom: 18px; }
.countdown { display: flex; align-items: baseline; gap: 10px; }
.countdown .big { font-family: var(--font-kanji); font-weight: 800; font-size: 56px; line-height: 1; color: var(--ai); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: grid; gap: 14px; }
.levels { display: grid; gap: 12px; }
.level-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.level-row .lv { font-weight: 700; }
.bar { height: 10px; border-radius: 6px; background: var(--ai-soft); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .s-known { background: var(--ai); }
.bar .s-learning { background: color-mix(in srgb, var(--ai) 45%, var(--ai-soft)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.cta { display: grid; gap: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 14px 16px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--surface); }
.btn.primary .muted { color: color-mix(in srgb, var(--surface) 75%, var(--ai)); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn .count { font-family: var(--font-kanji); font-weight: 800; font-size: 26px; line-height: 1; }
.btn .label { display: grid; gap: 2px; }
.btn .label b { font-size: 16px; }
.btn .label small { font-size: 12px; }
.small-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.small-btn.danger { color: var(--again); border-color: color-mix(in srgb, var(--again) 50%, var(--line)); }
.plan-line { font-size: 13px; color: var(--muted); }

/* ---------- study sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }
.sheet-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 18px; }
.progress { height: 6px; background: var(--ai-soft); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ai); transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.card-front { display: grid; justify-items: center; gap: 10px; padding-block: 10px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); }
.tag.new { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.tag.relearn { background: color-mix(in srgb, var(--again) 15%, var(--surface)); color: var(--again); }

/* genkō yōshi cell: the square with dashed centre guides used on kanji practice sheets */
.cell {
  width: min(62vw, 230px); aspect-ratio: 1; max-width: 100%; position: relative;
  border: 2px solid var(--grid); display: grid; place-items: center;
  background:
    linear-gradient(var(--grid), var(--grid)) center / 100% 1px no-repeat,
    linear-gradient(var(--grid), var(--grid)) center / 1px 100% no-repeat;
}
.cell::before { content: ""; position: absolute; inset: 0; background: var(--surface); opacity: .55; }
.cell .k { position: relative; font-family: var(--font-kanji); font-weight: 800; font-size: min(46vw, 170px); line-height: 1; }
.word-front { font-family: var(--font-kanji); font-weight: 800; font-size: clamp(44px, 15vw, 72px); line-height: 1.15; padding: 18px 22px; border: 2px solid var(--grid); text-align: center; display: grid; gap: 4px; max-width: 100%; }
.word-front span { font-family: var(--font-body); font-weight: 500; font-size: 20px; color: var(--ai); }
.word-front.revealed { font-size: 40px; padding: 8px 16px; }
.prompt { font-size: 13px; color: var(--muted); text-align: center; }

.back { display: grid; gap: 14px; }
.headline { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.headline .k-small { font-family: var(--font-kanji); font-weight: 800; font-size: 64px; line-height: 1; }
.keyword { font-size: 22px; font-weight: 700; line-height: 1.2; }
.meaning { font-size: 13px; color: var(--muted); }
.card-img.small { aspect-ratio: 16 / 7; }
.card-img { width: 100%; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; display: block; background: var(--ai-soft); }
.story { font-size: 16px; line-height: 1.65; }
.story .kw { color: var(--ai); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.story .prim { font-weight: 700; border-bottom: 2px solid color-mix(in srgb, var(--ai) 35%, transparent); }
.story .snd { font-weight: 700; color: var(--hard); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.section-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.sound { display: grid; gap: 6px; }
.sound-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--hard) 10%, var(--surface)); }
.sound-row .r { font-weight: 700; font-size: 16px; min-width: 3.2em; }
.readings { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.readings dt { font-weight: 700; color: var(--muted); font-size: 12px; padding-top: 2px; }
.readings dd { margin: 0; min-width: 0; }
.vocab { display: grid; gap: 0; }
.vocab-row { display: grid; grid-template-columns: minmax(0, auto) 1fr; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.vocab-row:first-child { border-top: 0; }
.vocab-row .w { font-family: var(--font-kanji); font-weight: 800; font-size: 20px; line-height: 1.2; }
.vocab-row .rd { font-size: 14px; color: var(--ai); font-weight: 500; align-self: end; }
.vocab-row .m { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.answer-bar .row { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); }
.answer-bar .row.one { grid-template-columns: 1fr; }
.answer-bar .row.two { grid-template-columns: 1fr 1fr; }
.ans { border: 0; border-radius: 12px; padding: 12px 4px; font-weight: 700; display: grid; gap: 1px; justify-items: center; color: var(--surface); }
.ans small { font-weight: 400; font-size: 11px; opacity: .85; }
.ans.again { background: var(--again); } .ans.hard { background: var(--hard); }
.ans.good { background: var(--good); } .ans.easy { background: var(--easy); }
.ans.reveal, .ans.next { background: var(--ai); }
.ans.skip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

/* ---------- deck ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--surface); }
.search { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font: inherit; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 2px 5px; display: grid; justify-items: center; gap: 0; position: relative; }
.tile .k { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.15; }
.tile .kwd { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 3px; }
.tile::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.tile.st-learning::after { background: var(--hard); }
.tile.st-struggling::after { background: var(--again); }
.tile.st-good::after { background: var(--good); }
.tile.st-mastered::after { background: var(--ai); }

/* ---------- stats ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi .v { font-family: var(--font-kanji); font-weight: 800; font-size: 28px; line-height: 1.1; }
.kpi .l { font-size: 12px; color: var(--muted); }
.forecast { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 110px; }
.forecast .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; min-width: 0; }
.forecast .b { width: 100%; background: var(--ai); border-radius: 3px 3px 0 0; min-height: 2px; }
.forecast .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.forecast .d { font-size: 10px; color: var(--muted); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; }
.heat i { width: 12px; height: 12px; border-radius: 2px; background: var(--ai-soft); }
.heat i.l1 { background: color-mix(in srgb, var(--ai) 30%, var(--ai-soft)); }
.heat i.l2 { background: color-mix(in srgb, var(--ai) 55%, var(--ai-soft)); }
.heat i.l3 { background: color-mix(in srgb, var(--ai) 80%, var(--ai-soft)); }
.heat i.l4 { background: var(--ai); }
.leech-list { display: flex; flex-wrap: wrap; gap: 6px; }
.leech { border: 1px solid color-mix(in srgb, var(--again) 40%, var(--line)); background: var(--surface); border-radius: 10px; padding: 4px 10px; font-family: var(--font-kanji); font-weight: 800; font-size: 22px; }

/* ---------- more ---------- */
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="number"], input[type="date"] { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: inherit; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.cast div { font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.cast b { display: inline-block; min-width: 3em; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--ai-soft); }
.confirm { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--again); }

.modal { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; align-items: end; }
.modal-body { background: var(--paper); max-height: 88%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 560px; margin: 0 auto; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="loading">Loading deck…</div></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="today" aria-current="page"><span class="jp">今日</span>Today</button>
  <button data-view="deck"><span class="jp">一覧</span>Deck</button>
  <button data-view="stats"><span class="jp">記録</span>Stats</button>
  <button data-view="more"><span class="jp">設定</span>More</button>
</nav>

<div class="sheet" id="sheet" hidden></div>
<div class="answer-bar" id="answer-bar" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-body" id="modal-body"></div></div>

<script>
'use strict';
// ============ DATA ============
let DECK = [];            // loaded from kanji.json
let BY_KANJI = {};
let CAST = {};            // on'yomi → {hook, emoji}
let CAST_NOTE = '';

// ============ DATES (local time, not UTC) ============
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function addDays(dateStr, n) { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

// ============ FSRS-4.5 ============
const FSRS = {
  w: [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755],
  DECAY: -0.5, FACTOR: 19 / 81,
  clampD(d) { return Math.min(10, Math.max(1, d)); },
  initS(g) { return this.w[g - 1]; },
  initD(g) { return this.clampD(this.w[4] - (g - 3) * this.w[5]); },
  R(t, s) { return Math.pow(1 + this.FACTOR * t / s, this.DECAY); },
  interval(s, retention) { return Math.max(1, Math.round(s / this.FACTOR * (Math.pow(retention, 1 / this.DECAY) - 1))); },
  nextD(d, g) { return this.clampD(this.w[7] * this.initD(3) + (1 - this.w[7]) * (d - this.w[6] * (g - 3))); },
  nextS(d, s, r, g) {
    const w = this.w;
    if (g === 1) return Math.min(s, w[11] * Math.pow(d, -w[12]) * (Math.pow(s + 1, w[13]) - 1) * Math.exp(w[14] * (1 - r)));
    const hard = g === 2 ? w[15] : 1, easy = g === 4 ? w[16] : 1;
    return s * (Math.exp(w[8]) * (11 - d) * Math.pow(s, -w[9]) * (Math.exp(w[10] * (1 - r)) - 1) * hard * easy + 1);
  }
};

// ============ STORAGE ============
// Same key as the previous app, so existing progress (keyed by kanji character) carries over.
const STORAGE_KEY = 'kanji_srs_data';
function emptyData() {
  return { version: 2, cards: {}, triaged: {}, newByDay: {}, history: {},
           stats: { totalReviews: 0, correctReviews: 0, streak: 0, lastReviewDate: null },
           settings: { examDate: '2026-12-06', newPerDay: 'auto', retention: 0.9 } };
}
function loadData() {
  let d = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
  const base = emptyData();
  if (!d || typeof d !== 'object') return base;
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  d.settings = Object.assign(base.settings, d.settings || {});
  d.stats = Object.assign(base.stats, d.stats || {});
  d.version = 2;
  return d;
}
let storageOk = true;
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); storageOk = true; }
  catch (e) { storageOk = false; }
}
let appData = loadData();

// ============ SCHEDULING ============
function maxInterval() {
  // Keep every card coming back at least once before exam week.
  const left = daysBetween(today(), appData.settings.examDate) - 7;
  return Math.max(7, Math.min(45, left));
}
function schedule(kanji, grade) {
  const t = today();
  let c = appData.cards[kanji];
  const ret = appData.settings.retention || 0.9;
  if (!c) {
    c = { stability: FSRS.initS(grade), difficulty: FSRS.initD(grade), reps: 1, lapses: grade === 1 ? 1 : 0, lastReview: t };
  } else {
    const elapsed = Math.max(0, daysBetween(c.lastReview || t, t));
    const r = FSRS.R(Math.max(elapsed, 0.5), Math.max(c.stability || 0.5, 0.1));
    c.stability = Math.max(0.1, FSRS.nextS(c.difficulty || 5, c.stability || 0.5, r, grade));
    c.difficulty = FSRS.nextD(c.difficulty || 5, grade);
    c.reps = (c.reps || 0) + 1;
    if (grade === 1) c.lapses = (c.lapses || 0) + 1;
    c.lastReview = t;
  }
  let days = Math.min(maxInterval(), FSRS.interval(c.stability, ret));
  // New cards always come back tomorrow (unless "Easy"): the first overnight check is where most forgetting happens.
  if (c.reps === 1 && grade < 4) days = Math.min(days, 1);
  c.due = addDays(t, days);
  appData.cards[kanji] = c;
}
function logReview(passed) {
  const t = today();
  appData.stats.totalReviews++;
  if (passed) appData.stats.correctReviews++;
  appData.history[t] = (appData.history[t] || 0) + 1;
  if (appData.stats.lastReviewDate !== t) {
    appData.stats.streak = appData.stats.lastReviewDate === addDays(t, -1) ? (appData.stats.streak || 0) + 1 : 1;
    appData.stats.lastReviewDate = t;
  }
}
function status(k) {
  const c = appData.cards[k.kanji];
  if (!c) return 'new';
  const s = c.stability || 0;
  if ((c.lapses || 0) >= 3 && s < 7) return 'struggling';
  if (s < 3) return 'learning';
  if (s < 21) return 'good';
  return 'mastered';
}
function unseen() { return DECK.filter(k => !appData.cards[k.kanji]); }
function recall(c) {
  // Estimated chance you still remember this card today (FSRS retrievability).
  return FSRS.R(Math.max(0.5, daysBetween(c.lastReview || today(), today())), Math.max(0.1, c.stability || 0.1));
}
function dueReviews() {
  const t = today();
  // Lowest recall chance first, so if you stop early you've rescued the cards closest to being forgotten.
  return DECK.filter(k => appData.cards[k.kanji] && appData.cards[k.kanji].due <= t)
             .sort((a, b) => recall(appData.cards[a.kanji]) - recall(appData.cards[b.kanji]));
}
function studyDaysLeft() { return Math.max(1, daysBetween(today(), appData.settings.examDate) - 7); }
function suggestedNew() { return Math.min(30, Math.max(5, Math.ceil(unseen().length / studyDaysLeft()))); }
function dailyNewLimit() {
  const s = appData.settings.newPerDay;
  return s === 'auto' ? suggestedNew() : Math.max(0, parseInt(s, 10) || 0);
}
function newLeftToday() {
  let limit = dailyNewLimit();
  // A big review backlog means new cards would only make it bigger: halve them until it clears.
  if (appData.settings.newPerDay === 'auto' && dueReviews().length > 120) limit = Math.ceil(limit / 2);
  return Math.max(0, limit - (appData.newByDay[today()] || 0));
}
function newQueue() {
  // Untriaged unseen cards first follow deck order; triaged "not yet" cards are just unseen cards too.
  return unseen().slice(0, newLeftToday());
}

// ============ HELPERS ============
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function storyHtml(s) {
  return esc(s)
    .replace(/\{([^}]+)\}/g, '<span class="kw">$1</span>')
    .replace(/\[([^\]]+)\]/g, '<span class="prim">$1</span>')
    .replace(/~([^~]+)~/g, '<span class="snd">$1</span>');
}
function kata2hira(s) { return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
const $ = id => document.getElementById(id);

// ============ CARD BACK ============
function backHtml(k, mode) {
  const sound = (k.sound || []).filter(x => x.hook);
  // Learning a new card: picture and story lead. Checking an answer: readings and words lead, so you can grade fast.
  const img = k.image ? `<img class="card-img${mode === 'quiz' ? ' small' : ''}" src="${esc(k.image)}" alt="Mnemonic illustration for ${esc(k.keyword)}" loading="lazy" onerror="this.remove()">` : '';
  const story = `<div class="story">${storyHtml(k.story || '')}</div>`;
  const soundH = sound.length ? `<div class="sound"><div class="section-label">Sound cast</div>${sound.map(x =>
      `<div class="sound-row"><span class="r" lang="ja">${esc(x.r)}</span><span>${esc(x.emoji || '')} ${esc(x.hook)}</span></div>`).join('')}</div>` : '';
  const vocabH = (k.vocab || []).length ? `<div><div class="section-label">Words for the exam</div><div class="vocab">${k.vocab.map(v => `
      <div class="vocab-row"><span class="w" lang="ja">${esc(v.w)}</span><span class="rd" lang="ja">${esc(v.r)}</span><span class="m">${esc(v.m)}</span></div>`).join('')}</div></div>` : '';
  const body = mode === 'quiz' ? vocabH + soundH + story + img : img + story + soundH + vocabH;
  return `
  <div class="back">
    <div class="headline">
      <div class="k-small" lang="ja">${esc(k.kanji)}</div>
      <div>
        <div class="keyword">${esc(k.keyword)}</div>
        ${k.meaning && k.meaning.toLowerCase() !== k.keyword.toLowerCase() ? `<div class="meaning">usually means: ${esc(k.meaning)}</div>` : ''}
        <div class="chips" style="margin-top:6px">${(k.components || []).map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
      </div>
    </div>
    ${body}
    <dl class="readings">
      <dt>ON</dt><dd lang="ja">${esc((k.on || []).join('・') || '–')}</dd>
      <dt>KUN</dt><dd lang="ja">${esc((k.kun || []).join('・') || '–')}</dd>
      <dt>INFO</dt><dd>N${k.level} · ${k.strokes} strokes · RTK #${k.frame}</dd>
    </dl>
  </div>`;
}

// ============ STUDY SESSION ============
// Queue items: {k, mode: 'learn' | 'quiz' | 'triage', again: bool}
let session = null;

function startStudy(extra) {
  // Mature cards (seen 2+ times) alternate between the bare kanji and a real exam word containing it,
  // because N3 tests readings of words, not of lone kanji.
  const items = dueReviews().map(k => {
    const c = appData.cards[k.kanji];
    const words = (k.vocab || []).filter(v => v.w.length > 1);
    const useWord = c && c.reps >= 2 && words.length && c.reps % 2 === 0;
    return { k, mode: 'quiz', word: useWord ? words[c.reps % words.length] : null };
  });
  const fresh = extra ? unseen().slice(0, extra) : newQueue();
  // Interleave: a new card after every 3 reviews keeps sessions from front-loading all the hard work.
  const queue = [];
  let ri = 0;
  for (const k of fresh) {
    for (let j = 0; j < 3 && ri < items.length; j++) queue.push(items[ri++]);
    queue.push({ k, mode: 'learn' });
  }
  while (ri < items.length) queue.push(items[ri++]);
  if (!queue.length) return;
  session = { queue, i: 0, revealed: false, done: 0, kind: 'study', extra: !!extra };
  openSheet();
}
function startTriage() {
  const queue = unseen().filter(k => !appData.triaged[k.kanji]).map(k => ({ k, mode: 'triage' }));
  if (!queue.length) return;
  session = { queue, i: 0, revealed: false, done: 0, kind: 'triage', undo: [] };
  openSheet();
}
function openSheet() { $('sheet').hidden = false; $('answer-bar').hidden = false; document.body.style.overflow = 'hidden'; renderSession(); }
function closeSheet() {
  session = null; $('sheet').hidden = true; $('answer-bar').hidden = true; document.body.style.overflow = '';
  render();
}
function insertLater(item, gap) {
  const pos = Math.min(session.queue.length, session.i + 1 + gap);
  session.queue.splice(pos, 0, item);
}

function renderSession() {
  if (!session) return;
  if (session.i >= session.queue.length) return renderSessionEnd();
  const it = session.queue[session.i];
  const k = it.k;
  const pct = session.i / session.queue.length * 100;
  const tags = [];
  if (it.mode === 'learn') tags.push('<span class="tag new">NEW</span>');
  if (it.again) tags.push('<span class="tag relearn">AGAIN</span>');
  if (it.mode === 'triage') tags.push(`<span class="tag">N${k.level} · DO YOU KNOW IT?</span>`);
  else tags.push(`<span class="tag">N${k.level}</span>`);
  const showBack = it.mode === 'learn' || session.revealed;
  const word = it.mode === 'quiz' ? it.word : null;
  const prompt = it.mode === 'triage'
    ? 'Know its meaning and at least one common reading?'
    : it.mode === 'learn' ? 'New kanji: read the story, say the words out loud.' : 'Say a reading and the meaning, then tap to check.';
  $('sheet').innerHTML = `<div class="sheet-inner">
    <div class="sheet-top">
      <button class="icon-btn" id="s-close" aria-label="End session">✕</button>
      <div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <span class="num muted" style="font-size:13px">${session.queue.length - session.i}</span>
    </div>
    <div class="card" id="s-card">
      <div class="card-front">
        <div class="tag-row">${tags.join('')}</div>
        ${showBack && it.mode !== 'triage' ? (word ? `<div class="word-front revealed" lang="ja">${esc(word.w)}<span>${esc(word.r)}</span></div>` : '')
          : word ? `<div class="word-front" lang="ja">${esc(word.w)}</div><div class="prompt">Read this word aloud (exam style), then tap to check.</div>`
          : `<div class="cell"><span class="k" lang="ja">${esc(k.kanji)}</span></div><div class="prompt">${prompt}</div>`}
      </div>
      ${showBack ? backHtml(k, it.mode === 'learn' ? 'learn' : 'quiz') : ''}
    </div>
  </div>`;
  $('sheet').scrollTop = 0;
  let bar;
  if (it.mode === 'learn') {
    bar = `<div class="row one"><button class="ans next" id="a-learned">Got it — quiz me in a moment</button></div>`;
  } else if (it.mode === 'triage') {
    const btns = [session.undo.length ? `<button class="ans skip" id="t-undo">Undo</button>` : '',
      session.revealed ? '' : `<button class="ans skip" id="t-peek">Peek</button>`,
      `<button class="ans again" id="t-no">Not yet</button>`, `<button class="ans good" id="t-yes">Know it</button>`].filter(Boolean);
    bar = `<div class="row" style="grid-template-columns:repeat(${btns.length}, 1fr)">${btns.join('')}</div>`;
  } else if (!session.revealed) {
    bar = `<div class="row one"><button class="ans reveal" id="a-reveal">Show answer</button></div>`;
  } else {
    const c = appData.cards[k.kanji];
    const preview = g => {
      if (!c) return g === 1 ? 'today' : g < 4 ? 'tomorrow' : Math.min(maxInterval(), FSRS.interval(FSRS.initS(g), appData.settings.retention)) + 'd';
      return '';
    };
    bar = `<div class="row">
      <button class="ans again" data-g="1">Again<small>${it.again ? 'still no' : 'forgot'}</small></button>
      <button class="ans hard" data-g="2">Hard<small>${preview(2) || 'slow'}</small></button>
      <button class="ans good" data-g="3">Good<small>${preview(3) || 'got it'}</small></button>
      <button class="ans easy" data-g="4">Easy<small>${preview(4) || 'instant'}</small></button></div>`;
  }
  $('answer-bar').innerHTML = bar;
}

function renderSessionEnd() {
  const triage = session.kind === 'triage';
  $('sheet').innerHTML = `<div class="sheet-inner"><div class="card" style="text-align:center;padding:32px 18px">
    <div class="cell" style="margin:0 auto"><span class="k" lang="ja">${triage ? '済' : '終'}</span></div>
    <h2 style="margin-top:14px">${triage ? 'Triage done' : 'Session done'}</h2>
    <p class="muted">${triage ? `Unseen kanji left to learn: ${unseen().length}. The daily plan now uses that number.` : `${session.done} cards answered. Come back when more reviews are due.`}</p>
  </div></div>`;
  $('answer-bar').innerHTML = `<div class="row one"><button class="ans next" id="s-finish">Back to today</button></div>`;
}

function grade(g) {
  const it = session.queue[session.i];
  const k = it.k;
  if (!it.again) {
    // First answer for this card in this session counts for scheduling.
    schedule(k.kanji, g);
    logReview(g > 1);
  }
  session.done++;
  if (g === 1) insertLater({ k, mode: 'quiz', again: true }, 4);
  saveData();
  next();
}
function next() { session.i++; session.revealed = false; renderSession(); }

function triageAnswer(known) {
  const it = session.queue[session.i];
  const k = it.k.kanji;
  session.undo.push({ k, prevCard: appData.cards[k], prevTri: appData.triaged[k] });
  appData.triaged[k] = known ? 'known' : 'unknown';
  if (known) {
    // Spread "already known" checks over the next 4 weeks so they don't arrive as one wall of reviews.
    const t = today();
    appData.cards[k] = { stability: 25, difficulty: 3, reps: 1, lapses: 0, lastReview: t,
                         due: addDays(t, 4 + Math.floor(Math.random() * 24)), triaged: true };
  }
  saveData();
  session.done++;
  next();
}
function triageUndo() {
  const u = session.undo.pop(); if (!u) return;
  if (u.prevCard) appData.cards[u.k] = u.prevCard; else delete appData.cards[u.k];
  if (u.prevTri) appData.triaged[u.k] = u.prevTri; else delete appData.triaged[u.k];
  saveData();
  session.i = Math.max(0, session.i - 1); session.revealed = false; session.done--;
  renderSession();
}

// ============ EVENTS ============
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-k]');
  if (!t) { if (e.target === $('modal')) $('modal').hidden = true; return; }
  const id = t.id;
  if (t.closest('#tabs')) { view = t.dataset.view; confirmingReset = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.k && !t.closest('.sheet')) return showDetail(t.dataset.k);
  if (t.dataset.lv !== undefined) { deckFilter.level = +t.dataset.lv; render(); return; }
  if (t.dataset.g) return grade(+t.dataset.g);
  switch (id) {
    case 'go-study': return startStudy();
    case 'go-extra': return startStudy(5);
    case 'go-triage': return startTriage();
    case 's-close': case 's-finish': return closeSheet();
    case 'a-reveal': session.revealed = true; return renderSession();
    case 'a-learned': {
      const it = session.queue[session.i];
      appData.newByDay[today()] = (appData.newByDay[today()] || 0) + 1;
      saveData();
      insertLater({ k: it.k, mode: 'quiz' }, 3);
      return next();
    }
    case 't-yes': return triageAnswer(true);
    case 't-no': return triageAnswer(false);
    case 't-peek': session.revealed = true; return renderSession();
    case 't-undo': return triageUndo();
    case 'modal-close': $('modal').hidden = true; return;
    case 'b-copy': return copyBackup();
    case 'b-restore': return restore($('backup').value);
    case 'r-ask': confirmingReset = true; return render();
    case 'r-no': confirmingReset = false; return render();
    case 'r-yes': appData = emptyData(); saveData(); confirmingReset = false; view = 'today'; return render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'deck-search') { deckFilter.q = e.target.value; renderDeckGrid(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'set-exam' && e.target.value) { appData.settings.examDate = e.target.value; saveData(); }
  if (e.target.id === 'set-new') { const v = e.target.value.trim(); appData.settings.newPerDay = v === '' ? 'auto' : String(Math.max(0, parseInt(v, 10) || 0)); saveData(); render(); }
  if (e.target.id === 'b-file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(e.target.files[0]); }
});
document.addEventListener('keydown', e => {
  if (!session || e.target.matches('input, textarea')) return;
  const it = session.queue[session.i];
  if (!it) { if (e.key === 'Enter' || e.key === ' ') closeSheet(); return; }
  if (e.key === 'Escape') return closeSheet();
  if (it.mode === 'learn' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); $('a-learned').click(); }
  else if (it.mode === 'triage') { if (e.key === 'ArrowRight' || e.key === 'k') triageAnswer(true); if (e.key === 'ArrowLeft' || e.key === 'n') triageAnswer(false); }
  else if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.revealed = true; renderSession(); }
  else if (session.revealed && '1234'.includes(e.key)) grade(+e.key);
});

function copyBackup() {
  const txt = JSON.stringify(appData);
  const ta = $('backup'); ta.value = txt;
  const msg = $('b-msg');
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = 'Backup is in the box above, selected. Copy it with your device\'s Copy command.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => { msg.textContent = 'Backup copied. Paste it into a note or email to yourself.'; }, fallback);
  } else fallback();
}
function restore(txt) {
  const msg = $('b-msg');
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d.cards !== 'object') throw new Error('no cards');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    appData = loadData();
    msg.textContent = `Restored ${Object.keys(appData.cards).length} cards.`;
  } catch (e) {
    msg.textContent = 'That text is not a backup from this app. Copy the whole backup, starting with { and ending with }.';
  }
}

// ============ BOOT ============
fetch('kanji.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  DECK = data.cards;
  CAST = data.cast || {};
  CAST_NOTE = data.castNote || '';
  BY_KANJI = Object.fromEntries(DECK.map(k => [k.kanji, k]));
  render();
}).catch(() => {
  $('app').innerHTML = '<div class="loading">The deck file (kanji.json) did not load. If you opened this file directly from disk, serve the folder instead: python3 -m http.server</div>';
});
</script>
</body>
